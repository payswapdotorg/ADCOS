  - "Hard contract constraints may not be silently weakened by infrastructure failure; free-tier exhaustion must fail explicitly and observably."
  - "Software deployment evidence must not be presented as physical connectivity evidence; EVID-002..EVID-008 remain outside software deployment acceptance."
  - "No secrets or credential values may be committed or printed."
  - "Work is isolated on a deployment branch until reviewed and merged; existing ADCOS worker limits (at most 3 direct workers, at most 3 subagents each, depth at most 2) remain in force."

acceptance:
