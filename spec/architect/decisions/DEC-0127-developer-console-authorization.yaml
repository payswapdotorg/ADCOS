constraints:
  - "Architecture 1.1 remains frozen and normative; every accepted authority is consumed by reference through the canonical HTTP boundary — browser code never imports Python/domain internals, never forks domain semantics and never creates an alternate durable authority."
  - "ConnectivityContract remains the canonical durable authority; provider-native topology/routing/subscriber authority remains provider-owned — the UI never implies an ADCOS-owned universal topology graph."
  - "Every meaningful UI mutation maps to a supported backend operation and exposes an API representation; API Explorer exposes only actually-supported operations; backend reason codes are preserved verbatim and searchable in developer errors."
  - "Hard contract constraints are never silently weakened by UI serialization; no frontend business rule weakens a backend requirement; backend validation semantics govern the contract builder."
  - "SOFTWARE evidence and physical/network evidence remain visibly distinct; no UI state may transform software evidence into a physical acceptance; EVID-002..EVID-008 remain outside console acceptance."
  - "Secrets obey backend issuance/reveal semantics and are never persisted in browser state; no fake production network/provider data; no decorative metric without an operational interpretation."
  - "Backend changes are limited to the smallest missing read/mutation endpoints and stable typed payloads required by the coverage audit; runtime handlers remain translations only; the existing /healthz, /readyz, /demo and deployment acceptance semantics stay intact."
  - "No secrets or credential values may be committed or printed."
  - "Work is isolated on console branches until reviewed and merged; the ADCOS worker limits (at most 3 direct workers, at most 3 subagents each, depth at most 2) remain in force; the Tech Lead owns integration, backend gap closure, deployment, browser verification, production promotion, rollback and acceptance."

acceptance:
  - "Console acceptance is SOFTWARE-class only and follows the handoff's deployment acceptance: GET / returns the actual ADCOS console; the existing /healthz and /readyz semantics remain intact (the backend stays the resolver for the whole /api/* namespace); core resource journeys work in a deployed environment; at least one create/read/mutation journey is reproducible through the displayed API request; API errors retain canonical reason codes; the existing R0-R9 software governance and deployment checks remain green; no physical evidence obligation is claimed as satisfied by UI/software tests. The frozen plan's acceptance checklist (root URL serves the console, all primary navigation functional, contract lifecycle inspectable, supported mutations reachable, API Explorer reproducible, object JSON inspectable, provider boundaries accurate, fulfillment/replanning explainable, evidence/assurance first-class and provenance-aware, credentials understandable and safe, reason codes surviving into UI errors, no frontend authority or semantic fork, no fake production data, existing gates green, browser acceptance passing against deployed preview and production) governs the final acceptance record."

rejected_scope:
  - "This decision does not activate any roadmap gate, does not create an authorizations/ record, and does not alter the post-R9 halted roadmap state (roadmap.yaml v2.22, execution mode awaiting-architect-decisions)."
  - "This decision does not change ConnectivityContract semantics, does not replace the accepted deployment authority, does not convert software validation into physical connectivity claims, and does not satisfy or modify any physical evidence obligation (EVID-002..EVID-008 remain open; R4/W040 remains in-review and unaccepted)."
  - "The console is not a marketing site, not a generic admin template, and not a second execution engine; a new durable authority in the browser, an ADCOS-owned universal topology, and any silent weakening of hard requirements for UX convenience are escalation-to-Architect stop conditions, not implementation options."

