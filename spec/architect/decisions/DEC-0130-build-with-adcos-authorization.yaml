constraints:
  - "Architecture 1.1 remains frozen and normative; every accepted authority is consumed by reference through the canonical HTTP boundary — browser code never imports Python/domain internals, never forks domain semantics and never creates an alternate durable authority."
  - "ConnectivityContract remains the sole durable ADCOS contract authority; a consuming application is never granted a second connectivity-contract authority; ADCOS sells/allocates technology-neutral connectivity outcomes, never provider-specific access technology; provider-native topology, routing and subscriber authority stay provider-owned."
  - "Provider SDKs and provider-native network objects never appear in application-facing integration examples; webhooks remain observations, never canonical business state; API success is never represented as proof of physical connectivity success; software/deployment evidence and physical/network evidence remain visibly distinct (EVID-002..EVID-008 stay outside console acceptance)."
  - "Every operation identifier in the integration registry, the Build UI, the human docs and the LLM assets maps to the accepted coverage registry; examples correspond to real accepted operations or are explicitly labeled conceptual; unsupported operations never appear as executable; no invented endpoints, capabilities, webhook event types, credentials, providers or telemetry."
  - "The integration blueprint is presentation state only — never persisted, never claimed as deployment configuration; /build creates no new backend/domain authority."
  - "The public LLM assets are generated from the same frontend registries the UI uses (the anti-drift derivation) and are validated against them by tests; the LLM context carries the anti-drift rules verbatim in meaning (no second contract authority; no provider topology in application domains; webhooks not canonical; API success not physical proof; no invented endpoints/capabilities; data-plane/control-plane independence preserved unless explicitly chosen; canonical reason codes and API version/compatibility rules preserved; idempotency and declared request semantics honored; software evidence distinguished from physical evidence)."
  - "The ShareNet boundary is taught exactly: ShareNet keeps authority over content, P2P distribution, publisher trust, delivery receipts and application economics; ADCOS is authoritative for connectivity contract/orchestration; providers remain authoritative for provider-native realization/topology; a local ShareNet P2P transfer is never routed through ADCOS merely because ADCOS is used for gateway/backhaul connectivity; ShareNet's local/P2P data plane operates when ADCOS is unreachable."
  - "All currently accepted V1 and V2 capabilities remain regression-protected (the V1 expert workbench; the V2 Docs, Quickstart, Playbooks, tour, Explorer education and troubleshooting surfaces)."
  - "No secrets or credential values may be committed or printed; the LLM context pointer is a public-asset URL only."
  - "Work is isolated on console/docs branches until reviewed and merged; the ADCOS worker limits (at most 3 direct workers, at most 3 subagents each, at most 9 active descendants, depth at most 2) remain in force; the Tech Lead owns integration, verification, browser acceptance, production promotion, rollback and acceptance."

acceptance:
  - "Build with ADCOS acceptance is SOFTWARE-class only and follows the frozen design's section 14: a developer can choose an integration pattern and obtain a complete boundary explanation; the console enumerates the relevant supported capabilities and operations without inventing them; the generated blueprint identifies application/ADCOS/provider ownership explicitly; the human docs and LLM assets agree on operation IDs and rules; /llms.txt, /llms-full.txt, /adcos-integration-context.json, /adcos-capabilities.json and /adcos-operations.json are deployed, reachable (HTTP 200) and internally consistent; an LLM given only the LLM pack can produce a compliant architecture for the ShareNet pattern without importing provider-specific APIs or creating a second connectivity authority; existing Console V2 Docs, Quickstart, Playbooks and API Explorer remain accessible; no fake credentials, telemetry, provider state or physical-evidence claims are introduced; production browser acceptance proves /build and the LLM assets are reachable on adcos.vercel.app."
  - "The release gate (the plan's Task 6 / the handoff's verification): the backend spec/fresh-session checks, all V1 batteries and the existing frontend tests green; the integration-registry and LLM-pack consistency tests green; the browser acceptance over the full /build journey (choose pattern -> inspect ownership/lifecycle -> open API operation -> open docs -> retrieve LLM context) and the existing V2 entry points and expert workbench routes re-tested before promotion; the Tech Lead dispatch guard and architecture drift guard green at every pinned head."

rejected_scope:
  - "This decision does not activate any roadmap gate, does not create an authorizations/ record, and does not alter the post-R9 halted roadmap state (roadmap.yaml, execution mode awaiting-architect-decisions)."
  - "This decision does not replace the accepted ADCOS backend architecture, does not create a second API specification or endpoint catalog, does not generate or store secrets in public documentation, and does not automatically modify any application's architecture or codebase."
  - "A second durable authority in the browser or the LLM assets, an ADCOS-owned universal topology graph, provider SDK vocabulary in application-facing examples, webhook observations promoted to canonical state, API success presented as physical connectivity success, and any fake provider/network/production telemetry data are escalation-to-Architect stop conditions, not implementation options."

