# ADCOS Decision Record — DEC-0080
# Canonical roadmap freeze and repository-only authority

decision_id: DEC-0080
type: governance
status: ACCEPTED
work_item: null
date: "2026-09-05"
subject: "Freeze the ADCOS execution roadmap as the canonical repository authority and prohibit conversational dependency"

context:
  repository_main_sha_at_decision: a7d913385f866df6da890093c26539ad876f3ee4
  architecture_version: "1.0"
  protocol_version: "1.0"
  finding: "The persistent Architect package already establishes that chat is not authority, but the current mainline contains contradictory execution projections: execution-state activates W044 while durable GitHub history proves W044-W049 accepted deliveries and the current mainline does not contain every accepted implementation package. The repository therefore needs an explicit frozen program authority and fail-closed reconciliation semantics."

rules:
  - "The Git repository is the sole persistent source of truth for ADCOS. A conversation, prompt, chat transcript, external memory, issue comment, or model recollection has zero authority unless its consequence is persisted in the repository by the Architect."
  - "spec/architect/roadmap.yaml is the canonical and frozen execution/program roadmap. It is the only authoritative roadmap. roadmap.md is a human-readable projection of roadmap.yaml and may not introduce independent commitments or statuses."
  - "spec/architect/execution-state.yaml is the canonical current execution snapshot. It may describe the current execution slot and halt state but may not contradict roadmap.yaml or an accepted decision record."
  - "spec/architect/execution-ledger.yaml is the authoritative lifecycle/history ledger. It records accepted delivery history and reconciliation history; a historical ledger snapshot is not, by itself, permission to implement."
  - "spec/architect/authorizations/ is the only source of implementation permission. Exactly one active implementation authorization may exist, and only when roadmap.yaml and execution-state.yaml both declare execution as implementing."
  - "spec/work-items.md remains the frozen Work Item contract authority; spec/dependency-graph.md remains the frozen dependency authority; spec/architecture.md and spec/architecture-lock.md remain frozen architecture authorities."
  - "An implementation agent must be able to operate from a clean clone of main with no access to this conversation. Any instruction required to implement, review, recover, or accept work must exist in repository-local durable artifacts."
  - "When actual main differs from the persisted execution snapshot, implementation stops. The Architect must reconcile the snapshot before any new implementation authorization can become active."
  - "Accepted historical delivery facts are never erased or downgraded merely because their artifacts are absent from the current mainline. Their absence is represented as mainline integrity debt requiring explicit restoration."
  - "Software evidence never closes a physical evidence obligation. W040 remains independent and W040-owned."
  - "The single-Architect review and merge authority from DEC-0053 remains unchanged; no separate reviewer is required."

