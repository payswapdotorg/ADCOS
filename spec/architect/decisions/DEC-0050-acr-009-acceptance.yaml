findings:
  - "ACR-009 Commercial Connectivity Control Plane is accepted as an additional commercial control-plane architecture layer. It preserves the permanent mission and does not replace or redefine identity, session, routing, NetworkPath, transport, or packet authorities."
  - "The accepted architecture separates commercial state from regulated payment movement: ADCOS owns canonical commercial intent, usage correlation, allocation policy, settlement state, and audit lineage; external payment providers remain responsible for payment authorization, payment rails, and regulated funds movement."
  - "Jurisdiction-aware connectivity and payment eligibility are mandatory architectural boundaries."
  - "The three-way economic model is accepted: gross billable proceeds may be allocated deterministically among the connectivity provider, application/developer, and ADCOS, subject to versioned platform constraints and explicit fees, reserves, and adjustments."
  - "ACR-009 is architecture direction only. It does not itself authorize implementation. Concrete commercial schema/API changes require separate repository-local Work Item authorization."
