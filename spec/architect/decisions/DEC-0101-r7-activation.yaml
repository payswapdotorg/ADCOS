evidence:
  - "M001 is accepted and closed (DEC-0100; M001-CORE-001 status accepted, authorized false; ACR-014 ACCEPTED; 1.0 preserved verbatim under spec/history/); live main push CI green at 4168f73 (run 34366545495) and at the reconciliation repair 1e5c55f (run 34367311873)."
  - "All four current-governance gates re-run locally on the pre-decision head: current_spec_check PASS, tech_lead_guard PASS, architecture_drift_guard PASS (governance-only), fresh_session_check PASS (exact snapshot equality after the 1e5c55f re-baseline)."
  - "The fresh-session live-main reconciliation was repaired at 1e5c55f to the standing reconciliation convention (snapshot == live main OR ancestor with governance-only deltas between, fail-closed otherwise), removing the structural self-reference defect that blocked implementation PRs."
  - "The R7 activation predicates of roadmap v1.7 are satisfied: gate-specific Work Item contract (the R7 charter), dependency overlay (R7.yaml), evidence policy (charter + authorization evidence classes), and the repository-local implementation authorization (R7-CORE-001, this decision)."

findings:
  - "R7 is UNLOCKED with its M001 prerequisite satisfied by DEC-0100, but no gate-specific contract, overlay, or authorization existed — implementation was halted at a governance fixed point: the mechanism that authorizes engineering work had itself become a prerequisite deliverable of engineering work."
  - "The repository already contains a large migration reservoir (adapters, commercial core, developer API, capabilities, policy, federation, mobility) that the frozen classification matrix assigns to the M003-M014 child scopes; the bottleneck was administrative serialization, not architectural uncertainty."
  - "The per-work-item pre-implementation ceremony chain (one contract + overlay + obligations + authorization issuance per M-item) would add 13 more governance events before the tranche could proceed, while per-item ACCEPTANCE already provides the serialization point that actually protects the architecture."
  - "The historical per-item activation pattern (DEC-0095 for W057, DEC-0098 for M001) is superseded for the R7 tranche by a bounded program authorization with child scopes: one active authorization (R7-CORE-001) covering the charter's declared child scopes, with per-child acceptance decisions keeping Architect control at the evidence boundary."

