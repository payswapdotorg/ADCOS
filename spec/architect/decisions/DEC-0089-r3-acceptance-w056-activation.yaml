w056_required_coverage:
  - "versioned external API contract and compatibility classification"
  - "idempotent mutation semantics under retries and duplicates"
  - "scoped application credentials and capability boundaries"
  - "sandbox/production namespace isolation"
  - "canonical server-side reason-code propagation without reinterpretation"
  - "signed webhook integrity, replay, duplicate, and out-of-order handling"
  - "pagination and stable retrieval semantics where the existing API exposes collections"
  - "SDK contract equivalence to canonical server semantics"
  - "rate limiting/resource protection without changing business authority"
  - "evidence that API/webhook observation never becomes canonical connectivity or commercial state"
  - "deterministic structural and authority-boundary audits"

w056_non_authority_rule: "WORK-056 hardens the developer boundary only. It may not create a second commercial, connectivity, identity, session, NetworkPath, routing, transport, usage, allocation, payment, or policy authority."

