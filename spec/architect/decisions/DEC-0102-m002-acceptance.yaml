acceptance_findings:
  - "Every M002 acceptance criterion in the R7 charter was reproduced by the Tech Lead against the exact delivery head before the merge: the canonical ConnectivityContract domain implements the frozen 1.1 §3 field set (contract identity; principal and beneficiary scope; normalized requirements; accepted offer references; hard constraints; committed service properties; validity interval; usage and pricing terms; assurance obligations; permitted execution scope; termination and compensation rules; provenance; signature references), lease/expiry semantics with renewal audit trails, the contract-level lifecycle state machine (frozen 1.1 §11 reference lifecycle + §9 degraded/terminal states, exhaustive transition table), hard-constraint structural immutability (LOCK-108), and structural authority uniqueness (LOCK-117: execution artifacts as opaque data). Deterministic, offline, seeded; no wall clock, no randomness, no network; secrets never stored (LOCK-119); canonical-JSON round-trips; journal fold with idempotency; battery green (54/54); the evidence doc records the verification matrix (SOFTWARE 54/54; physical NOT-TESTABLE/OPEN; EVID-002..008 untouched)."
  - "Worker-executed delivery loop (per the Tech Lead operating model): the M002 core and the f261b8 consultation repairs were implemented by the Tech Lead's predecessor session; the three CI-repair riders were implemented by a dispatched worker session (chartered, monitored, reviewed, and approved by the Tech Lead) — the first ADCOS delivery executed through the dispatch/review/approve loop the operator directed. Each rider is bounded, root-caused, disclosed in the PR body, and preserves every invariant."
  - "Two defects were found in the branch's own earlier repair material and fixed honestly before acceptance: (1) the f261b8 scale case_37 Pattern-B block carried a latent str/Path TypeError (never executed anywhere before — CI died at earlier batteries and local pre-flights filtered on FAIL text); (2) the f261b8 imt case_33 repair left the .github sub-check in the delta-inclusion form. Both fixed at 0112943 with semantics preserved. The pre-flight lesson is recorded: battery verification must be exit-code-based (tracebacks and lowercase 'failed' are failures too)."
  - "A genuine intermittent defect was found and fixed at the delivery boundary: case_42_b3_real_ipv6_loopback_conformance failed ~20% of runs (reproduced locally by the Tech Lead with the exact CI signature; always leg1) — root cause was a test-side check-before-latch race in the case's echo server (server_state latched only after conn.sendall returned, while the client asserts as soon as the echo becomes readable), NOT an engine defect; the engine is acquitted. The fix latches the received-payload evidence before the echo write (deterministic happens-before; no sleep, no retry; the case remains a real ::1 end-to-end round-trip)."

