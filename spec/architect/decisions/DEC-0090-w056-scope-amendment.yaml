# DEC-0090 — WORK-056 minimal scope amendment for W054 test-oracle reconciliation
# Durable governance decision. Does not change frozen Architecture Version 1.0
# or Protocol Version 1.0 semantics and does not create a new Work Item.
decision_id: DEC-0090
date: "2026-09-06"
type: "governance-scope-amendment"
status: accepted
owner: "Architect"

subject: "Amend WORK-056-CORE-001 narrowly to reconcile the accepted W054 composition oracle after repairing W046"

facts:
  work_item: WORK-056
  authorization: WORK-056-CORE-001
  parent_decision: DEC-0089
  delivery_under_review: "4ac8107811546e14f9a29a50139000e1a0231752"
  base_mainline: "4852a016fce61cecec8078084da1d9bbe81d2681"
  authorized_baseline: "7ae438d46041b228164cc8880be37dc21f972b6f"
  defect_repaired: "The accepted W046 developer boundary was import-broken at the W056 authorized baseline because it referenced usage.lifecycle/allocation.lifecycle and UsageLedgerError names superseded by accepted W052/W053 public surfaces."
  regression_observed: "The accepted W054 composition battery case_03 still expects the historical WORK-046 DEFECT classification, while the repaired developer boundary now correctly imports and is therefore AVAILABLE."

amendment:
  exact_path: "tools/composition_selftest.py"
  allowed_change: "Only reconcile the W054 WORK-046 oracle to the repaired availability state: case_03 must expect AuthorityAvailability.AVAILABLE instead of DEFECT and must assert the repaired-state detail rather than the obsolete import-broken/no-repair wording."
  prohibited_changes:
    - "any composition authority implementation"
    - "any production networking, connectivity, commercial, identity, session, NetworkPath, routing, transport, payment, usage, allocation, or policy behavior"
    - "any W048 restoration or substitution"
    - "any W040 physical evidence or disposition"
    - "any change to W054 semantic coverage outside the exact W046 availability oracle reconciliation"
    - "any change outside tools/composition_selftest.py under this amendment"
  duration: "one WORK-056 delivery only; expires with the first Architect acceptance or rejection of the amended WORK-056 delivery"

architecture_constraints:
  architecture_version: "1.0"
  protocol_version: "1.0"
  frozen_semantics_unchanged: true
  new_work_item_created: false
  exactly_one_active_implementation_authorization: true
  active_authorization_remains: WORK-056-CORE-001
  sole_architect_review_merge_authority: true
  software_never_promotes_to_physical: true

rationale: "The W056 implementation is authorized to repair developerapi/, and doing so changes the truth of a pre-existing W054 test oracle. Leaving the accepted oracle red would violate WORK-056's explicit requirement that existing accepted batteries remain green. The narrowest valid remedy is therefore a governance-authorized, one-file, one-behavioral-classification reconciliation under the same WORK-056 authorization; no new Work Item is warranted."

governance_requirements:
  - "The W056 worker must not apply this exception until the amendment is present on the authoritative governance mainline."
  - "The implementation PR must remain within the amended exact scope and must disclose the amendment by DEC-0090."
  - "The Architect must re-run the full W056 battery and the W054 composition battery at the corrected delivery head."
  - "The composition battery must return to 55/55 with no other changes introduced under this amendment."
  - "This amendment does not authorize the currently identified API compatibility break; that remains a separate W056 acceptance blocker requiring correction within developerapi/ or a separately authorized versioned governance change."

result: "WORK-056 remains active; PR #17 remains unaccepted pending both the API compatibility correction and the DEC-0090-authorized composition oracle reconciliation."
