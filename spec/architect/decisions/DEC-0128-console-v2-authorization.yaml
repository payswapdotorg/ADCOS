constraints:
  - "Architecture 1.1 remains frozen and normative; every accepted authority is consumed by reference through the canonical HTTP boundary — browser code never imports Python/domain internals, never forks domain semantics and never creates an alternate durable authority."
  - "ConnectivityContract remains the sole durable contract authority; provider-native topology/routing/subscriber authority remains provider-owned — the UI never implies an ADCOS-owned universal topology graph."
  - "Every interactive example and API example corresponds to a real accepted backend operation or is explicitly labeled conceptual; the Explorer remains generated from the accepted coverage registry and unsupported operations never appear as executable controls."
  - "Backend reason codes remain canonical and verbatim; teaching layers may explain them but must not replace them; unknown reason codes are preserved without invented semantics."
  - "SOFTWARE evidence and physical/network evidence remain visibly distinct; no UI state may transform software evidence into a physical acceptance; EVID-002..EVID-008 remain outside console acceptance."
  - "Hard contract constraints are never silently weakened by forms, examples or learning flows; no frontend business rule weakens a backend requirement."
  - "Secrets follow backend issuance/reveal rules and are never persisted in browser storage; no fake provider, network, fulfillment, assurance, performance or production telemetry data; no decorative visualization without operational or educational meaning."
  - "Documentation must distinguish conceptual explanation from current implementation truth; documentation, UI terminology and API examples share a canonical concept/operation vocabulary so drift is detectable (the coverage test fails when a supported canonical operation has no educational description unless explicitly marked internal-only or not-user-actionable)."
  - "When a capability is not available in the current HTTP deployment, the UI explains the actual state instead of presenting a dead button or a fabricated result (the truth-and-disclosure rule)."
  - "All currently accepted V1 capabilities remain regression-protected: contracts, builder, networks, eligibility/policy explanation, fulfillment, evidence, assurance, developer application/capability views, API Explorer, requests, settings, health/readiness, search and error workbench."
  - "No secrets or credential values may be committed or printed."
  - "Work is isolated on console branches until reviewed and merged; the ADCOS worker limits (at most 3 direct workers, at most 3 subagents each, at most 9 active descendants, depth at most 2) remain in force; the Tech Lead owns integration, verification, browser acceptance, production promotion, rollback and acceptance."

acceptance:
  - "Console V2 acceptance is SOFTWARE-class only and follows the frozen design's acceptance standard: a new developer with no prior ADCOS knowledge must understand ADCOS's purpose without external explanation, describe the core lifecycle in their own words after the Quickstart, complete the guided connectivity journey, understand the important objects encountered, find the relevant API operation from the workflow, execute at least one supported API operation and understand the response, locate documentation for every primary console concept, find troubleshooting guidance for canonical errors, move from beginner guidance into the expert V1 workbench without losing context, and complete the primary journey without encountering unexplained architecture jargon."
  - "The release gate (the plan's Task 8): the backend spec/fresh-session checks, all V1 batteries and V1 frontend tests green; the education registry consistency/coverage tests green; the V2 browser acceptance (first visit -> product explanation -> mental model -> Quickstart -> tour -> API Explorer -> docs -> expert workbench; the canonical error and degraded/unavailable-backend education; keyboard/accessibility and compact-width behavior); the preview deploy inspected before promotion; production must prove / is the V2 learning-first product while /api/*, /healthz, /readyz and the V1 routes remain functional. No physical evidence obligation is claimed as satisfied by UI/software tests."

rejected_scope:
  - "This decision does not activate any roadmap gate, does not create an authorizations/ record, and does not alter the post-R9 halted roadmap state (roadmap.yaml v2.22, execution mode awaiting-architect-decisions)."
  - "This decision does not replace the accepted ADCOS backend architecture, does not replace V1 API tooling with chat, does not create a fake sandbox implying production network access, does not invent provider topology, does not add frontend-only business rules, and does not rewrite internal architecture/evidence documents as end-user documentation."
  - "V2 is not a marketing site, not a generic admin template and not a second execution engine; a second durable authority in the browser, an ADCOS-owned universal topology, any silent weakening of hard requirements for UX convenience, and any fake provider/network/production telemetry data are escalation-to-Architect stop conditions, not implementation options."

