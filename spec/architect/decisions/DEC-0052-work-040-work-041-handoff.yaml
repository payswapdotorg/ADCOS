  - "WORK-040's correction cycle is non-terminal: execution-ledger.yaml records lifecycle: in-review, acceptance_decision: null, correction_decisions: [DEC-0046]. Superseding the active authorization does NOT accept WORK-040 and does NOT close its correction cycle; it transfers only the single active execution slot so that W041 may proceed."
  - "WORK-040's PHYSICAL evidence obligations EVID-007 (real users/devices participate, status PARTIAL) and EVID-008 (real 5G access path, status NOT-TESTABLE) are owned by WORK-040 and governed by spec/architect/evidence-obligations.yaml with review_decision DEC-0046. They remain OPEN and are NOT closed, weakened, or transferred by this decision. Anti-promotion discipline (software PASS never becomes physical PASS) is preserved unchanged."
  - "WORK-041's ready-candidate contract (spec/architect/work-items/WORK-041.md) declares Required dependencies WORK-016, WORK-018, WORK-033, WORK-034 — all Architect-accepted and merged in the execution ledger (lifecycle: accepted-merged). ACR-005 (accepted by DEC-0047) is the architecture basis, recorded as an authority_input (not a Work Item dependency). W041's Execution gate requires an ACTIVE repository-local authorization with the exact baseline and scope before implementation may proceed."
  - "No frozen architecture document is modified by this transition. The frozen dependency graph (spec/dependency-graph.md) does not contain W041 as a node (it terminates at W040) and contains no W040->W041 edge; the W041->W042 and W042->W048 interface dependencies remain in the ready-candidate contracts and are preserved unchanged. The W041 authorization scope is the ACR-005 NetworkPath/platform boundary (per the W041 contract), NOT commercial core, NOT W042, NOT W043, NOT W048."
