  - "the usage/economic ledger state ONLY: canonical records and deterministic state/reconciliation behavior for usage observations, correlation to authorized delivery/path evidence, billable finality, reconciliation from observed delivery to billable quantity/amount, and compensating refunds/reversals/disputes — billable usage as an append-only, deterministic, auditable derivation from authoritative delivered-traffic evidence, separable from payment state; no new identity/session/routing/path/transport/federation/policy/payment/delivery authority is created, mutated, or shadowed"

