# ADCOS Work Item authorization record — WORK-052 active implementation.
#
# WORK-052-CORE-001 (issued by DEC-0059): the Architect's repository-local
# authorization for WORK-052 (UsageLedger: delivered-usage metering,
# billable finality, and append-only reconciliation, ACR-009). This record
# is the sole durable authority for W052 implementation scope. It becomes
# the single active authorization at the moment DEC-0059 merges,
# atomically superseding WORK-051-CORE-001 (whose Work Item is
# accepted-merged through the same DEC-0059 transition) so the single
# active execution slot is never vacant (mode implementing + zero active
# auths = STOP) nor double-occupied (two active auths = ARCH-03 FAIL).
#
# Scope is the UsageLedger boundary per the frozen WORK-052 contract
# (spec/work-items.md; tracking issue #84; ACR-009 / DEC-0050) and the
# Architect-issued handoff (docs/WORK-052-handoff.md, merged
# documentation-only by PR #118): derive billable usage from authoritative
# delivered-traffic evidence — NEVER from payment capture and NEVER from
# reservation/lease state — as canonical records and deterministic
# state/reconciliation behavior for usage observations, correlation to
# authorized delivery/path evidence, billable finality, reconciliation
# from observed delivery to billable quantity/amount, and compensating
# refunds/reversals/disputes.
#
# UsageLedger owns usage/economic ledger state ONLY. It may consume the
# authoritative references exposed by W051 CommercialCore (accepted-merged
# DEC-0059), W041 NetworkPath (accepted-merged DEC-0054), W042
# journal-first/recovery discipline (accepted-merged DEC-0057), and the
# established WORK-033 clock seam. It must never create, mutate, or
# shadow the identity, session, NetworkPath, routing, transport, payment,
# or delivery authorities. Provider/payment observations are data, never
# proof of delivery. W052 does NOT authorize WORK-044 through WORK-050,
# WORK-053, or any other Work Item; every registered dependency edge
# remains hard and unchanged. W052 makes NO physical validation claim:
# W052 is a SOFTWARE-class control-plane implementation and any physical
# claims remain governed separately by W040's open PHYSICAL obligations
# EVID-007/EVID-008 (W040 stays in-review and is NOT accepted).
#
# Baseline note: baseline_sha is 41b338080fbeb79627bff45cd79ddf09bf5cbb29
# (the post-W051-merge mainline — the mainline carrying the accepted W051
# delivery, reconciled by LEDGER-RECON-008 in the same DEC-0059
# transition). Per the RECON-002/003/004/005/006/007/008 convention it
# moves in lockstep with the snapshot baseline only through a formally
# recorded reconciliation; the W052 handoff documentation-only merge
# 5eb198b (PR #118) and this governance merge sit beyond the recorded
# baseline without changing persistent state — there is no in-flight W052
# implementation branch to invalidate at activation time; a future W052
# implementation PR branches from the mainline carrying this exact record
# (the W44-established governance-only branch-point offset), preserves it
# byte-identically, and must not modify spec/architect/.
#
# schema: spec/architect/authorizations/ (v1); verified by tools/spec_check.py (ARCH-03).

work_item: WORK-052
status: active
authorized: true
type: implementation
authorization_id: "WORK-052-CORE-001"
authorization_decision: DEC-0059
baseline_sha: 41b338080fbeb79627bff45cd79ddf09bf5cbb29
