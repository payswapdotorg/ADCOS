  - "WORK-051 CommercialCore accepted-merged (DEC-0059; PR #145 head e247b4e, merge 41b3380) — the commercial lifecycle, Lease authority, and billable-final commercial facts consumed where their interfaces are exposed"
  - "WORK-041 NetworkPath accepted-merged (DEC-0054) — NetworkPath identities referenced, never owned"
  - "WORK-042 platform integration and journal-first recovery accepted-merged (DEC-0057) — journal-first/recovery discipline reused where applicable"
