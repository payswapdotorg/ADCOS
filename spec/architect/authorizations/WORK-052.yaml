required_corrections: []

acceptance_criteria:
  - "Usage requires authorized delivery evidence; payment capture and reservation/lease state never create usage."
  - "Duplicate observations do not double-charge; out-of-order observations do not produce nondeterministic ledger state; delayed observations reconcile deterministically."
  - "Billable finality is explicit, immutable, and cannot rewrite prior facts; corrections are append-only compensating records."
  - "Usage records correlate delivered quantity to an authorized delivery/path evidence record and remain auditable end to end."
  - "Commerce cannot mutate connectivity/session/path/routing/transport authorities."

evidence_classes:
  - criterion: "Software/architecture conformance"
    class: SOFTWARE
    allowed_statuses:
      - PASS
      - PARTIAL
      - NOT-TESTABLE
      - OPEN
  - criterion: "Deterministic automated verification"
    class: SOFTWARE
    allowed_statuses:
      - PASS
      - PARTIAL
      - NOT-TESTABLE
      - OPEN
  - criterion: "Physical-device evidence (not required for W052 implementation: the usage ledger is a pure software control-plane model; any physical claims remain governed separately)"
    class: PHYSICAL
    allowed_statuses:
      - PASS
      - PARTIAL
      - NOT-TESTABLE
      - OPEN

out_of_scope:
  - "payment-provider rails, payout execution, custody of regulated funds, KYC/KYB, jurisdiction policy, marketplace discovery, and developer SDKs (later authorized Work Items per the WORK-052 contract explicit non-scope)"
  - "creating, mutating, or shadowing the identity, session, NetworkPath, routing, transport, payment, or delivery authorities (UsageLedger owns usage/economic ledger state only)"
  - "treating payment capture as usage evidence"
  - "treating reservation or lease state as usage evidence"
  - "treating provider/payment observation as delivery proof (provider observations are data, never proof of delivery)"
  - "rewriting historical delivery observations or usage facts (corrections are append-only compensating records)"
  - "W040 continuation (W040 remains an independent physical validation track, in-review and NOT accepted; EVID-007/EVID-008 remain W040-owned and OPEN)"
  - "WORK-044 through WORK-051, WORK-053, or any other Work Item (each requires its own repository-local authorization; every registered dependency edge remains hard)"
  - "modifying spec/architect/ in the implementation PR (the implementation PR inherits this authorization byte-identically from the mainline carrying it)"
  - "private authority access (and private-method fallbacks for ledger or evidence)"
  - "synthetic physical evidence presented as physical PASS"
  - "wire-schema changes unless separately authorized"
  - "modifying frozen spec semantics"

acceptance_gate:
  status: "Architect review required after implementation"
  required_evidence:
    - "criteria 1-5 of the WORK-052 contract satisfied with SOFTWARE-class conformance evidence"
    - "deterministic automated verification PASS covering at minimum: valid usage ingestion; missing/invalid delivery evidence rejection; duplicate ingestion with zero double-charge; delayed and out-of-order observations; immutable historical observations; explicit BillableFinal transition; reconciliation and audit trail; refund/reversal/dispute compensation; tamper detection; replay/recovery equivalence; payment-to-usage negative cases; reservation/lease-to-usage negative cases; authority-boundary/import discipline; deterministic two-run and hash-seed checks"
    - "restart and replay reproduce the same ledger projection byte-for-byte (the repository's canonical JSON/id/digest conventions and the WORK-033 clock seam; no randomness, no wall-clock reads, no vendor SDK coupling; exact redelivery idempotent; conflicting reuse of an observation identity fails closed)"
    - "existing accepted batteries remain green (W050 platformcaps 76/76 and W051 commercial 38/38 among the relevant accepted batteries); no authority ownership changes"
    - "exact execution SHA and evidence manifest; all relevant CI checks green"

handoff: docs/WORK-052-handoff.md
handoff_required: true
