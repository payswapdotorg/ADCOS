acceptance_criteria:
  - "Platform changes can be delivered event-first without polling-only semantics."
  - "Event/snapshot reconciliation is deterministic and idempotent."
  - "Process death/suspension does not lose durable authorization/journal state."
  - "Recovery reconstructs state correctly and records session loss honestly where transport state cannot survive process death."
  - "Existing accepted batteries remain green and authority ownership is unchanged."

evidence_classes:
  - criterion: "Software/architecture conformance"
    class: SOFTWARE
    allowed_statuses:
      - PASS
      - PARTIAL
      - NOT-TESTABLE
      - OPEN
  - criterion: "Deterministic automated verification"
    class: SOFTWARE
    allowed_statuses:
      - PASS
      - PARTIAL
      - NOT-TESTABLE
      - OPEN
  - criterion: "Physical-device evidence"
    class: PHYSICAL
    allowed_statuses:
      - PASS
      - PARTIAL
      - NOT-TESTABLE
      - OPEN

out_of_scope:
  - "W040 continuation (W040 remains an independent physical validation track, in-review and NOT accepted; EVID-007/EVID-008 remain W040-owned and OPEN)"
  - "W043+ implementation (W043 retired from commercial use; W044–W050 and the commercial chain W051/W052/W053 remain ready-candidates, unauthorized)"
  - "commercial core / payment / settlement implementation (ACR-009 commercial control plane is separate Work Item scope)"
  - "new identity/session/routing/transport/federation/policy authority"
  - "treating platform observations as protocol truth without existing authority establishment"
  - "continuous-daemon assumptions on Android or similar lifecycle-managed platforms"
  - "private authority access (and private-method fallbacks for recovery or evidence)"
  - "synthetic physical evidence presented as physical PASS (physical-device evidence is not required for W042 implementation; any physical claims remain governed separately)"
  - "wire-schema changes unless separately authorized"
  - "modifying frozen spec semantics"

acceptance_gate:
  status: "Architect review required after implementation"
  required_evidence:
