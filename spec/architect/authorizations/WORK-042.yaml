# ADCOS Work Item authorization record — WORK-042 active implementation.
#
# WORK-042-CORE-001 (issued by DEC-0055): the Architect's repository-local
# authorization for WORK-042 (Event-Driven Platform Integration and
# Journal-First Recovery, ACR-006). This record is the sole durable authority
# for W042 implementation scope. It becomes the single active authorization
# at the moment DEC-0055 merges, atomically superseding WORK-041-CORE-001
# (whose Work Item is accepted-merged through DEC-0054 in the same
# governance transition) so the single active execution slot is never vacant
# (mode implementing + zero active auths = STOP) nor double-occupied (two
# active auths = ARCH-03 FAIL), and so W042 is never active while its hard
# dependency W041 is not accepted-merged.
#
# Scope is the ACR-006 event-driven platform integration and journal-first
# recovery model per the W042 ready-candidate contract
# (spec/architect/work-items/WORK-042.md): a platform-event ingestion
# boundary carrying authoritative observations through the
# platform-adapter boundary, deterministic event/snapshot reconciliation
# (events are change notifications; snapshots remain state representation),
# an append-only journal with periodic compact snapshots, durable
# restart/suspension recovery that reconciles reconstructed state with the
# current platform observation, and preserved stable logical session
# identity and existing recovery/session-loss semantics — WITHOUT creating
# a new identity, session, routing, transport, federation, or policy
# authority, and without treating platform observations as protocol truth
# without existing authority establishment.
#
# W042 consumes the accepted WORK-041 NetworkPath/platform interfaces where
# needed (W041 accepted-merged by DEC-0054, PR #107, merge 96db8aa). W042
# does NOT authorize W043 (retired), W044..W053, or W048; the W042->W048
# (interfaces consumed) dependency remains hard per the ready-candidate
# contracts. W042 makes NO physical validation claims; physical-device
# evidence is not required for W042 implementation (W042 contract Evidence
# classes), and any physical claims remain governed separately by W040's
# open PHYSICAL obligations EVID-007/EVID-008 (W040 stays in-review and is
# NOT accepted; its track is independent of W042 and unaffected by this
# authorization).
#
# Baseline note: baseline_sha is 96db8aa (current main at this governance
# commit, the post-PR-#107 mainline). Per the RECON-002/003/004/005/006
# convention it moves in lockstep with the snapshot baseline only through a
# formally recorded reconciliation; there is no in-flight W042
# implementation branch to invalidate at activation time — a future W042
# implementation PR branches from a main carrying this exact record.
#
# schema: spec/architect/authorizations/ (v1); verified by tools/spec_check.py (ARCH-03).

work_item: WORK-042
status: active
authorized: true
type: implementation
authorization_id: "WORK-042-CORE-001"
authorization_decision: DEC-0055
baseline_sha: 96db8aa4423dff845a223e0c93c67f3dc14e314d
