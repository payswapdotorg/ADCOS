roadmap:
  - id: R0_MAINLINE_RESTORATION
    status: COMPLETE
    objective: "Restore the exact accepted W044-W049 implementation packages and CI/evidence artifacts onto the authoritative mainline without importing unrelated later ancestry or changing frozen semantics."
    required_output: "One verified mainline containing the accepted W044-W050/W051-W053 implementation set and their durable acceptance/governance records."
    implementation_authorization: none
    gate: "Architect verifies exact file set, accepted-head provenance, tree equivalence of recovered packages, no unauthorized semantic delta, and complete repository-local evidence."
    completion: "Accepted and merged as PR #8 on the exact frozen main 3bdfb6daf50f7c000d29a027584c0de5b376d8a8 (merge a3391e86851e06032de848e6eb0b4267fa33310a, tree 1d16c241d060c9c242f3025ea3afa73464574ccc byte-identical to the historical restoration tree 7fb47bb312708d06f3b3c1ba0496104362c7d135)."

  - id: R1_GOVERNANCE_RECONCILIATION
    status: COMPLETE
    objective: "Reconcile roadmap, current-state, execution-state, execution-ledger, decisions, authorizations, and evidence projections to the restored mainline."
    constraints: "Preserve every prior decision and reconciliation; never rewrite historical records."
    implementation_authorization: none
    completion: "Complete under DEC-0084 on the reconciled mainline a3391e86851e06032de848e6eb0b4267fa33310a8."

  - id: R2_SYSTEM_COMPOSITION_CONFORMANCE
    status: COMPLETE
    objective: "Prove the complete commercial/connectivity composition without introducing a second authority."
    work_item: WORK-054
    authorization: WORK-054-CORE-001
    authorization_decision: DEC-0086
    authorization_baseline: 13bfbda54eece391306ddb774e0700c9d862339a
    live_implementation_baseline: 461d1482180222f4b63f780d6d9ea1d54c49d643
    baseline_reconciliation_decision: DEC-0086
    completion_decision: DEC-0088
    completion_pr: 13
    completion_delivery_sha: 93ad4130f8308832e432ce3e83988f5a6a9b32e3
    completion_merge_sha: 57963858e5a2b9d11faed94b50f94e058cede0a8
    chain: "intent -> offer -> eligibility -> reservation/lease -> candidate selection -> NetworkPath validation -> containment -> session -> delivered traffic -> usage -> BILLABLE_FINAL -> allocation -> external payment reference -> reconciliation"
    result: "Accepted R2 conformance evidence. Strict production composition remains BLOCKED_MISSING_AUTHORITY at W048; production_composition=false."
    mandatory_negative_proofs:
      - "payment success cannot create connectivity"
      - "reservation success cannot imply reachability"
      - "marketplace discovery cannot activate a path"
      - "W050 capability declaration cannot enforce containment"
      - "W049 client state cannot become canonical state"
      - "API/webhook observation cannot become a second source of truth"
      - "software evidence cannot close physical evidence"

  - id: R3_PROTOCOL_PRODUCTION_CONFORMANCE
    status: COMPLETE
    objective: "Complete the production conformance layer required before declaring wire compatibility."
    work_item: WORK-055
    authorization: WORK-055-CORE-001
    authorization_decision: DEC-0088
    authorization_baseline: 57963858e5a2b9d11faed94b50f94e058cede0a8
    completion_decision: DEC-0089
    completion_pr: 15
    completion_delivery_sha: 0fc86aac57332ca8b8043bf5ee20bb3240d70fe8
    completion_merge_sha: 7801549c0ed50082a4fa7c20c71e50dc7bde87f9
    required: "canonicalization profile, canonical encoding vectors, signature coverage, version negotiation, unknown-field/extensions behavior, replay/idempotency, schema evolution, compatibility and migration vectors, deterministic digest stability, and authority/evidence separation"
    architecture_rule: "Do not change frozen protocol semantics without the ACR process."
    gate_rule: "R3 is accepted. R4/R5 may proceed in parallel according to the one-active-implementation-authorization rule; no R6 activation occurs until R5 is accepted."
    existing_foundation: "WORK-032 conformance suite and its public deterministic verifier remain the mandatory foundation; R3 extended/hardened that conformance layer rather than creating a second protocol authority."
    result: "Accepted by the sole Architect. In-repo evidence does not constitute external interoperability evidence."

  - id: R4_PHYSICAL_CONNECTIVITY_VALIDATION
    status: PARALLEL_AFTER_R3
    objective: "Complete W040 and related open physical-evidence obligations on real hardware/network environments."
    rule: "Physical evidence is independently collected, classified, and accepted; software batteries cannot close it. R4 is parallel with R5 after R3 and does not block R5 or R6."

  - id: R5_DEVELOPER_CONNECTIVITY_PLATFORM
    status: COMPLETE
    objective: "Make ADCOS consumable like Stripe: external applications request and manage connectivity through stable APIs without adopting an ADCOS user interface or knowing provider/access/path/payment implementation details."
    work_item: WORK-056
    authorization: WORK-056-CORE-001
    authorization_decision: DEC-0089
    authorization_baseline: 7ae438d46041b228164cc8880be37dc21f972b6f
    completion_decision: DEC-0094
    completion_pr: 21
    completion_delivery_sha: c2b2c59fae4749b610b721b217e18cfa9b4aab25
    completion_merge_sha: b11cf44db922811d2518c05685aee14127243264
    gate_rule: "R5 is accepted under DEC-0094. Its successor gate R6 is independently activated under DEC-0095; R4/W040 remains parallel and independent."
    required_surface:
      - "intent creation"
      - "offer/quote discovery"
      - "reservation/lease"
      - "activation and lifecycle status"
      - "termination/cancellation"
      - "usage/finalization projections"
      - "webhooks/events"
      - "idempotency and scoped credentials"
      - "sandbox/production isolation"
      - "developer-visible canonical reason codes"
    result: "Accepted developer connectivity platform production hardening."

  - id: R6_PROVIDER_ONBOARDING_AND_FEDERATION
    status: ACTIVE
    objective: "Enable independently operated networks, ISPs, carriers, enterprises, satellite systems, hotspots, mesh operators, and infrastructure owners to expose capacity through ADCOS without surrendering infrastructure authority."
    work_item: WORK-057
    authorization: WORK-057-CORE-001
    authorization_decision: DEC-0095
    authorization_baseline: 16c066ff4766d362f0edfcb790524b2c0ef44cae
    dependency_overlay: "spec/architect/dependency-overlays/R6-W057.yaml"
    handoff: "docs/WORK-057-handoff.md"
    required: "adapter certification, capability declaration, commercial contract/profile, policy boundary, service terms, settlement configuration, observability, trust/federation onboarding"
    dependency_rule: "R6 requires accepted R5 and the hard dependencies recorded in its gate-specific dependency overlay; R4 completion is not a prerequisite."
    scope_rule: "Onboarding and federation are bounded integration/orchestration concerns subordinate to the existing identity, trust, capability, resource, policy, federation, routing, session, transport, telemetry, and commercial authorities."
    no_new_authority: true
    no_w048_restoration: true

  - id: R7_UNIVERSAL_CONNECTIVITY_COMMERCE
    status: AFTER_R6
    objective: "Normalize heterogeneous connectivity resources into programmable offers selected by intent, policy, evidence, availability, quality, geography, and price."
    principle: "ADCOS coordinates connectivity; it does not need to own the underlying network."

  - id: R8_RESILIENCE_MOBILITY_AND_SCALE
    status: AFTER_R7
    objective: "Production-grade failover, multipath, mobility, local-first operation, offline/reconnect, reconciliation, disaster recovery, key rotation/revocation, upgrades, federation scale, and operational resilience."

  - id: R9_FUTURE_ACCESS_TECHNOLOGY
    status: AFTER_R8
    objective: "Add or replace access technologies through the adapter boundary without altering the connectivity protocol core."
    examples: "5G, Wi-Fi, Ethernet/fiber, satellite, mesh/IAB, enterprise WAN, future IMT/6G"

program_exit:
  stripe_of_connectivity_test: "An external application can request connectivity from ADCOS by API, ADCOS can evaluate policy and eligible offers, reserve capacity, select and validate a path, establish controlled connectivity, meter delivered usage, finalize billing, allocate economic value, integrate with an external payment provider, reconcile provider events, and expose canonical status via API/webhooks — without the application needing an ADCOS UI or knowledge of the underlying access technology/provider."
  architecture_test: "All success paths and recovery paths preserve the frozen single-authority model, evidence discipline, least authority, access-technology neutrality, and graceful degradation requirements."

freeze_rules:
  roadmap_changes_require: "A new durable governance decision in spec/architect/decisions/ and an updated roadmap version; no chat-only roadmap change is valid."
  work_item_changes_require: "The frozen Work Item/ACR process specified by spec/change-control.md and spec/work-items.md, or the accepted post-snapshot gate-specific execution model under ACR-013."
  current_execution_change_requires: "A repository-local decision/authorization recorded in spec/architect/."
  no_implicit_reordering: true
  no_chat_override: true
