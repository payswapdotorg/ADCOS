  - id: R7_UNIVERSAL_CONNECTIVITY_COMMERCE
    status: AFTER_R6
    objective: "Normalize heterogeneous connectivity resources into programmable offers selected by intent, policy, evidence, availability, geography, quality, and price."
    activation_rule: "R7 is unlocked but not activated. Create a gate-specific Work Item contract, dependency overlay, evidence obligations, and repository-local implementation authorization before implementation."
    architectural_direction: "The target Architecture 1.1 proposal makes ConnectivityContract the canonical durable object and permits authorized applications to purchase or sponsor connectivity for users/devices, while preserving Architecture 1.0 authority until formal ACR acceptance."

  - id: R8_RESILIENCE_MOBILITY_AND_SCALE
    status: AFTER_R7
    objective: "Harden failover, multipath, mobility, local-first operation, offline/reconnect, reconciliation, disaster recovery, key rotation/revocation, upgrades, federation scale, and operational resilience."

  - id: R9_FUTURE_ACCESS_TECHNOLOGY
    status: AFTER_R8
    objective: "Add or replace access technologies through the adapter boundary without altering the connectivity protocol core."
    examples: "5G, Wi-Fi, Ethernet/fiber, satellite, mesh/IAB, enterprise WAN, future IMT/6G"

program_exit:
  stripe_of_connectivity_test: "An external application can request connectivity from ADCOS by API, ADCOS can evaluate policy and eligible offers, reserve capacity, select and validate a path, establish controlled connectivity, meter delivered usage, finalize billing, allocate economic value, integrate with an external payment provider, reconcile provider events, and expose canonical status via API/webhooks — without the application needing an ADCOS UI or knowledge of the underlying access technology/provider."
  architecture_test: "All success and recovery paths preserve the single-authority model, evidence discipline, least authority, access-technology neutrality, and graceful degradation requirements."

freeze_rules:
  roadmap_changes_require: "A new durable governance decision in spec/architect/decisions/ and an updated roadmap version; no chat-only roadmap change is valid."
  work_item_changes_require: "The frozen Work Item/ACR process or the accepted post-snapshot gate-specific execution model under ACR-013."
  current_execution_change_requires: "A repository-local decision/authorization recorded in spec/architect/."
  no_implicit_reordering: true
  no_chat_override: true
