name: W054 baseline projection fix
on:
  push:
    branches:
      - governance/w054-activation-20260905
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align activation projections to authorized baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old='11bd981612274c69912fad7ea2e0de781514b347'
          new='ba3717fad3cc4a5894ff3fece4768e47e7db584c'
          for f in ['spec/architect/execution-ledger.yaml','spec/architect/execution-state.yaml','spec/architect/roadmap.yaml','spec/architect/current-state.md']:
              p=Path(f); s=p.read_text(); p.write_text(s.replace(old,new))
          Path('.github/workflows/w054-baseline-fix.yml').unlink()
          PY
          git config user.name 'ADCOS Architect'
          git config user.email '150378018+payswapdotorg@users.noreply.github.com'
          git add spec/architect .github/workflows/w054-baseline-fix.yml
          git commit -m 'governance: align W054 projections to authorized baseline [skip ci]'
          git push origin HEAD:governance/w054-activation-20260905
