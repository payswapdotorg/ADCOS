name: temporary-final-governance-reconcile

on:
  push:
    branches:
      - governance/w053-state-reconciliation-final

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile current W053 state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          SNAP='bcaf0d0677437d1ffca8f5e493cab516c87e7194'
          MAIN='246366a875d455cc6ba2605c8851a76825da1b9f'
          p=root/'spec/architect/execution-state.yaml'; s=p.read_text(encoding='utf-8')
          s=re.sub(r'^  main_sha_semantics: ".*"$', '  main_sha_semantics: "Persistent governance snapshot: post-W052 acceptance mainline `'+SNAP+'`, established by DEC-0061 / LEDGER-RECON-010. Governance PR #150 merged that transition as `'+MAIN+'`; this later governance-only merge is a continuation beyond the reconciled snapshot. The sole active authorization is WORK-053-CORE-001 with baseline `'+SNAP+'`; a W053 implementation branch must re-read exact live main and inherit that authorization byte-identically."', s, count=1, flags=re.M)
          s=s.replace('  last: "WORK-051"','  last: "WORK-052"',1)
          s=s.replace('status: "active (WORK-052-CORE-001, DEC-0059:', 'status: "accepted-merged (DEC-0061; PR #149 exact reviewed head 7d883b2, merge bcaf0d0; WORK-052-CORE-001 superseded)',1)
          s=s.replace('authorization: "WORK-052-CORE-001"','authorization: "none"',1)
          s=s.replace('status: "ready-candidate"\n    contract: "issue #85"\n    authorization: "none"','status: "active-authorized (WORK-053-CORE-001, DEC-0061; sole active implementation authorization on the post-W052 acceptance mainline)"\n    contract: "issue #85"\n    authorization: "WORK-053-CORE-001"',1)
          if '# STATE-RECON-001:' not in s: s='# STATE-RECON-001: post-DEC-0061 execution-state projection normalization.\n'+s
          p.write_text(s,encoding='utf-8')
          p=root/'spec/architect/current-state.md'; cs=p.read_text(encoding='utf-8')
          cs=cs.replace('Reconciled snapshot baseline: `39d40b752f9129ac898fb74da1e485c20c6fbdc6`','Reconciled snapshot baseline: `'+SNAP+'`',1)
          cs=cs.replace('`WORK-052` UsageLedger (issue #84) is the **active authorized** chain successor under `WORK-052-CORE-001` (DEC-0059, baseline reconciled to `39d40b7` by DEC-0060 / LEDGER-RECON-009) — the single active implementation track, gated per docs/WORK-052-handoff.md delivery protocol;','`WORK-052` UsageLedger (issue #84) is **accepted-merged** under DEC-0061 (PR #149 exact reviewed head `7d883b2`, merge `bcaf0d0`); its `WORK-052-CORE-001` authorization is superseded;')
          cs=cs.replace('implementation is gated on the WORK-052-CORE-001 authorization now active','implementation is gated on the WORK-053-CORE-001 authorization now active')
          cs=cs.replace('only WORK-052 is activated, by DEC-0059.','WORK-052 is accepted-merged and WORK-053 is the sole active authorization, by DEC-0061.')
          p.write_text(cs,encoding='utf-8')
          p=root/'tools/spec_check_selftest.py'; t=p.read_text(encoding='utf-8')
          for old,new in {'spec/architect/authorizations/WORK-052.yaml':'spec/architect/authorizations/WORK-053.yaml','active_work_item: WORK-052':'active_work_item: WORK-053','active_authorization: "WORK-052-CORE-001"':'active_authorization: "WORK-053-CORE-001"','WORK-053-CORE-001 landed through the DEC-0059 governance transition':'WORK-053-CORE-001 activated through the DEC-0061 governance transition','active WORK-053-CORE-001 scope (usage/)':'active WORK-053-CORE-001 scope (allocation/)'}.items(): t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          for q in root.rglob('*'):
              if q.is_file() and (q.name.startswith('_tmp_') or q.name.startswith('.final-trigger') or q.name in {'.reconcile-trigger','.selftest-fix-trigger','.state-trigger','.state-trigger-v3','.reconcile-trigger-final'}):
                  try: q.unlink()
                  except OSError: pass
          import subprocess
          for cmd in [['python3','tools/spec_check.py'],['python3','tools/spec_check_selftest.py']]:
              if subprocess.run(cmd).returncode: raise SystemExit(1)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','ADCOS Architect Governance'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','commit','-m','governance: finalize W053 execution-state reconciliation'],check=True)
          # Sync to any trigger commit then push the resulting fast-forward.
          subprocess.run(['git','fetch','origin','governance/w053-state-reconciliation-final'],check=True)
          subprocess.run(['git','rebase','origin/governance/w053-state-reconciliation-final'],check=True)
          subprocess.run(['git','push','origin','HEAD:governance/w053-state-reconciliation-final'],check=True)
          PY
