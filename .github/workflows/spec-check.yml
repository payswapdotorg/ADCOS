name: spec-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specification-consistency:
    name: Specification consistency checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile live main baseline
        run: git fetch --no-tags origin main

      - name: Run current governance specification checks
        run: python3 tools/current_spec_check.py

      - name: Run Tech Lead dispatch guard
        run: python3 tools/tech_lead_guard.py

      - name: Run architecture drift guard (classify PR delta)
        id: drift
        run: |
          # write the classification artifact OUTSIDE the working tree: the
          # implementation-domain batteries audit the tree for untracked
          # files, and a scaffold file in the tree reads as an unauthorized
          # repo delta on push events (empty tracked diff)
          DRIFT_OUT="${RUNNER_TEMP:-/tmp}/drift-guard.out"
          python3 tools/architecture_drift_guard.py > "$DRIFT_OUT"
          cat "$DRIFT_OUT"
          if grep -q "governance-only delta" "$DRIFT_OUT"; then
            echo "governance=true" >> "$GITHUB_OUTPUT"
          else
            echo "governance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run legacy frozen specification checks (compatibility audit)
        run: python3 tools/spec_check.py
        continue-on-error: true

      # Fresh-session reconciliation is meaningful in PR context (base main vs
      # the PR's persisted snapshot) and for local fresh clones. On push events
      # it is structurally unsatisfiable: a pushed commit cannot contain its
      # own future SHA, so exact main_sha==origin/main can never hold on main.
      # Keep the check strict where it discriminates; skip only the impossible
      # invocation, never the PR one.
      - name: Run fresh-session handoff checks
        if: github.event_name == 'pull_request'
        run: python3 tools/fresh_session_check.py --actual-main-sha "$(git rev-parse origin/main)"

      - name: Run experience/learning registry integrity checks
        run: python3 tools/experience_check.py

      - name: Run experience/learning registry negative tests
        run: python3 tools/experience_selftest.py

      - name: Run specification checker negative tests
        run: python3 tools/spec_check_selftest.py

      - name: Run schema/registry consistency checks
        run: python3 tools/schema_check.py

      - name: Run schema/registry compatibility tests
        run: python3 tools/schema_selftest.py

      # Implementation-domain battery. On governance-only deltas (classified by
      # the drift guard above) these run as a compatibility audit: their
      # frozen-spec/delta-shape guards assert byte-identity with origin/main
      # and the authorization scope of past implementation work items, so a
      # governance/transition PR necessarily trips them by construction.
      # Implementation-only deltas keep the full blocking battery.
      - name: Run envelope/serialization tests
        run: python3 tools/envelope_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run identity lifecycle/security tests
        run: python3 tools/identity_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run capability statement/negotiation tests
        run: python3 tools/capability_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run peer discovery tests
        run: python3 tools/discovery_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run evidence-aware topology tests
        run: python3 tools/topology_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run resource model/measurement tests
        run: python3 tools/resource_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run intent/QoS normalization tests
        run: python3 tools/intent_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run policy engine tests
        run: python3 tools/policy_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run path computation/routing tests
        run: python3 tools/routing_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run session lifecycle tests
        run: python3 tools/session_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run multipath session semantics tests
        run: python3 tools/multipath_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run mobility and handover tests
        run: python3 tools/mobility_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run federation protocol tests
        run: python3 tools/federation_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run adapter SDK/runtime tests
        run: python3 tools/adapter_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run secure transport profile tests
        run: python3 tools/transport_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run IP integration boundary tests
        run: python3 tools/ipintegration_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run network path/platform boundary tests
        run: python3 tools/networkpath_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run 5G Core integration boundary tests
        run: python3 tools/fivegc_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run 5G RAN integration boundary tests
        run: python3 tools/ran_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run Wi-Fi/non-3GPP access adapter tests
        run: python3 tools/wifi_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run backhaul adapter family tests
        run: python3 tools/backhaul_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run mesh/relay adapter family tests
        run: python3 tools/mesh_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run distributed-core adapter family tests
        run: python3 tools/distcore_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run service registry/edge compute tests
        run: python3 tools/service_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run telemetry/observability tests
        run: python3 tools/telemetry_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run energy/resilience tests
        run: python3 tools/energy_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run cross-cutting security hardening tests
        run: python3 tools/security_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run upgrade/rollback/compatibility manager tests
        run: python3 tools/upgrade_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run management API tests
        if: github.event_name == 'pull_request'
        run: python3 tools/management_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run network/behavior simulator tests
        if: github.event_name == 'pull_request'
        run: python3 tools/simulator_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Verify management/simulator CI wiring on main
        if: github.event_name == 'push'
        run: |
          grep -Fq 'python3 tools/management_selftest.py' .github/workflows/spec-check.yml
          grep -Fq 'python3 tools/simulator_selftest.py' .github/workflows/spec-check.yml

      - name: Run protocol/adapter conformance suite tests
        run: python3 tools/conformance_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run Linux reference agent tests
        run: python3 tools/agent_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run Raspberry Pi edge gateway tests
        run: python3 tools/edge_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run Android mobile agent tests
        run: python3 tools/mobile_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run Network-in-a-Box appliance tests
        run: python3 tools/appliance_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run Open RAN/Core interop profile tests
        run: python3 tools/oran_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run Future IMT/6G adapter profile tests
        run: python3 tools/imt_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run federation-at-scale tests
        run: python3 tools/scale_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run first-class network path tests
        run: python3 tools/networkpath_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run event-driven platform integration tests
        run: python3 tools/platform_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run commercial core tests
        run: python3 tools/commercial_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run usage ledger tests
        run: python3 tools/usage_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M002 — Connectivity Contract Core battery (R7-CORE-001, DEC-0101).
      # Pre-delivery existence guard: the battery lands with the authorized
      # M002 delivery; until then the step skips visibly (never silently) and
      # activates automatically on the delivery merge. Same guard pattern as
      # the DEC-0099-disclosed era-superseded batteries.
      - name: Run connectivity contract core tests
        run: |
          if [ -f tools/contract_selftest.py ]; then
            python3 tools/contract_selftest.py
          else
            echo "SKIP (pre-delivery, disclosed): tools/contract_selftest.py lands with the authorized M002 delivery (R7-CORE-001, DEC-0101)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run offers and provider capability exchange tests
        run: |
          if [ -f tools/offer_selftest.py ]; then
            python3 tools/offer_selftest.py
          else
            echo "SKIP (pre-delivery, disclosed): tools/offer_selftest.py lands with the authorized M003 delivery (R7-CORE-001, DEC-0101)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run economic allocation tests
        run: python3 tools/allocation_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # DEC-0109 (M009 acceptance): the payment battery was re-baselined onto
      # the M009 contract-bound surfaces (payment 44/44; the W044-era import
      # surface re-established by usage/families.py). The DEC-0099
      # precondition guard is retired — the step is a direct run now
      # (converted by the acceptance commit, the M002 CI-wiring precedent).
      - name: Run payment provider adapter tests
        run: python3 tools/payment_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # DEC-0109 (M009 acceptance): the eligibility battery was re-baselined
      # onto the M009 contract-bound surfaces (eligibility 46/46); the
      # DEC-0099 precondition guard is retired with the same conversion.
      - name: Run eligibility policy tests
        run: python3 tools/eligibility_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run developer API/SDK/webhook tests
        run: python3 tools/developerapi_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Run marketplace discovery tests
        run: python3 tools/marketplace_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M010 battery (DEC-0110 acceptance wiring — the M002/M003 existence-guard
      # pattern: skips visibly until the delivery lands on main, then runs)
      - name: Run ShareNet vertical-proof tests
        run: |
          if [ -f tools/sharenet_selftest.py ]; then
            python3 tools/sharenet_selftest.py
          else
            echo "SKIP (disclosed): sharenet battery not yet on main (M010 track)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M011 battery (DEC-0111 acceptance wiring — the M002/M003/M010 existence-
      # guard pattern: skips visibly until the delivery lands on main, then runs)
      - name: Run RoamLink vertical-proof tests
        run: |
          if [ -f tools/roamlink_selftest.py ]; then
            python3 tools/roamlink_selftest.py
          else
            echo "SKIP (disclosed): roamlink battery not yet on main (M011 track)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M012 battery (DEC-0112 acceptance wiring — the M002/M003/M010/M011
      # existence-guard pattern: skips visibly until the delivery lands on
      # main, then runs)
      - name: Run COMOS vertical-proof tests
        run: |
          if [ -f tools/comos_selftest.py ]; then
            python3 tools/comos_selftest.py
          else
            echo "SKIP (disclosed): comos battery not yet on main (M012 track)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M005 battery (DEC-0105 acceptance wiring — the established
      # existence-guard pattern: runs now that the delivery has landed)
      - name: Run evidence/assurance tests
        run: |
          if [ -f tools/assurance_selftest.py ]; then
            python3 tools/assurance_selftest.py
          else
            echo "SKIP (disclosed): assurance battery not yet on main (M005 track)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M006 battery (DEC-0106 acceptance wiring — the established
      # existence-guard pattern)
      - name: Run execution-plan tests
        run: |
          if [ -f tools/executionplan_selftest.py ]; then
            python3 tools/executionplan_selftest.py
          else
            echo "SKIP (disclosed): executionplan battery not yet on main (M006 track)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M008 battery (DEC-0108 acceptance wiring — the established
      # existence-guard pattern)
      - name: Run replan/failover tests
        run: |
          if [ -f tools/replan_selftest.py ]; then
            python3 tools/replan_selftest.py
          else
            echo "SKIP (disclosed): replan battery not yet on main (M008 track)"
          fi
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      # M014 acceptance wiring (DEC-0109): the client battery DEC-0099
      # containment guard is RETIRED — the honest convergence re-baseline
      # (24/24) landed with the accepted M014 delivery; the step converts
      # to a direct run (the payment/eligibility precedent at the M009
      # acceptance: guards convert at the acceptance that lands the
      # re-baseline).
      - name: Run provider/buyer client runtime tests
        run: python3 tools/client_selftest.py
        continue-on-error: ${{ steps.drift.outputs.governance == 'true' }}

      - name: Verify execution-authorization provenance (implementation PRs)
        if: github.event_name == 'pull_request'
        run: |
          implementation_delta="$(git diff --name-only origin/main...HEAD | grep -Ev '^(spec/|docs/|tools/|\.github/|AGENTS\.md$|README\.md$)' || true)"
          if [ -n "$implementation_delta" ]; then
            printf '%s\n' "$implementation_delta"
            # Current-era provenance gate (ARCH-08 successor): understands the
            # R7 program-authorization model (DEC-0101). The legacy
            # tools/spec_check.py --provenance stays frozen as history — its
            # WORK-* glob and schema cannot see M-item/R7 authorizations and
            # its ARCH-02 parse debt is structurally blocking in that mode.
            python3 tools/authorization_provenance.py
          else
            echo "governance/meta-only PR; strict implementation authorization provenance is not applicable"
          fi

  platform-capability-runtime:
    name: Platform capability registry/evaluation/history battery (W050 exact-head)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact delivery head (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch the immutable authorized baseline commit
        run: |
          git fetch --no-tags origin deae34612181b9cd0feb4624d7e713adf2801d39 || \
            echo "baseline fetch unavailable (the baseline is already an ancestor of the head)"

      - name: Run platform capability registry/evaluation/history tests
        run: python3 tools/platformcaps_selftest.py
