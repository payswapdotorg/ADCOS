name: W054 acceptance final2
on:
  push:
    branches:
      - governance/w054-acceptance-final2-20260905
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize W054 acceptance projections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          MAIN='22c21309390518a7f4869e057cfee59cde049be0'
          REVIEWED='f6824ccd0beb28b69c932e87610a63856f1399d6'
          MERGED_AT='2026-09-05T14:07:29Z'
          CI='33970713183'

          # Ledger: targeted W054 block edit only; preserve every other byte.
          p=Path('spec/architect/execution-ledger.yaml')
          s=p.read_text(encoding='utf-8')
          start=s.find('  - work_item: WORK-054\n')
          end=s.find('\nreconciliations:\n', start)
          if start < 0 or end < 0:
              raise SystemExit('W054 ledger boundaries not found')
          block=s[start:end]
          substitutions=[
              (r'(?m)^    pr: .*$', '    pr: 4'),
              (r'(?m)^    pr_head: .*$', '    pr_head: '+REVIEWED),
              (r'(?m)^    reviewed_sha: .*$', '    reviewed_sha: '+REVIEWED),
              (r'(?m)^    merge_sha: .*$', '    merge_sha: '+MAIN),
              (r'(?m)^    merged_at: .*$', '    merged_at: '+MERGED_AT),
              (r'(?m)^    ci_run: .*$', '    ci_run: '+CI),
              (r'(?m)^    review_rounds: .*$', '    review_rounds: 4'),
              (r'(?m)^    acceptance_decision: .*$', '    acceptance_decision: DEC-0085'),
              (r'(?m)^    handoff_required: .*$', '    handoff_required: false'),
              (r'(?m)^    lifecycle: .*$', '    lifecycle: accepted-merged'),
              (r'(?m)^    note: .*$', '    note: "Accepted by DEC-0085 on exact reviewed head f6824ccd0beb28b69c932e87610a63856f1399d6; PR #4 merged as 22c21309390518a7f4869e057cfee59cde049be0; W054 exact-head battery 33970713183 and merge-main W054 battery PASS. W054 remains orchestration/conformance evidence only."'),
          ]
          for pat,repl in substitutions:
              block,n=re.subn(pat,repl,block,count=1)
              if n!=1: raise SystemExit('ledger field mismatch '+pat)
          s=s[:start]+block+s[end:]
          if 'reconciliation_id: LEDGER-RECON-025' not in s:
              if not s.endswith('\n'): s+='\n'
              s+='''  - reconciliation_id: LEDGER-RECON-025\n    recorded_by: DEC-0085\n    recorded_at: 2026-09-05T14:07:29Z\n    from_main_sha: 338af793923e1267ff3523de4310be273d75a2cd\n    to_main_sha: 22c21309390518a7f4869e057cfee59cde049be0\n    reason: "W054 exact-head acceptance after merged implementation PR #4; closes R2."\n    history: "No prior Work Item acceptance or reconciliation was rewritten; W054 is the only new lifecycle transition."\n'''
          p.write_text(s,encoding='utf-8')

          # Release W054 authorization while preserving provenance.
          p=Path('spec/architect/authorizations/WORK-054.yaml')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(?m)^status: active$','status: superseded',s,count=1)
          s=re.sub(r'(?m)^authorized: true$','authorized: false',s,count=1)
          if 'supersession_decision: DEC-0085' not in s: s=s.rstrip()+'\nsupersession_decision: DEC-0085\n'
          p.write_text(s,encoding='utf-8')

          # Execution state.
          p=Path('spec/architect/execution-state.yaml'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'(?m)^  main_sha: .*$', '  main_sha: '+MAIN, s,count=1)
          s=re.sub(r'(?m)^  lifecycle_ledger_snapshot_sha: .*$', '  lifecycle_ledger_snapshot_sha: '+MAIN, s,count=1)
          s=re.sub(r'(?m)^  mode: active$', '  mode: ready', s,count=1)
          s=re.sub(r'(?m)^  active_work_item: WORK-054$', '  active_work_item: null', s,count=1)
          s=re.sub(r'(?m)^  active_authorization: WORK-054-CORE-001$', '  active_authorization: null', s,count=1)
          s=re.sub(r'(?m)^  halted_reason: null$', '  halted_reason: "W054 accepted under DEC-0085. No implementation authorization is active. R3 production protocol conformance requires a fresh Work Item and authorization."', s,count=1)
          s=s.replace('    - "Create the governed R2 Work Item for system-composition conformance without introducing a second authority."','    - "Create the governed R3 production-protocol-conformance Work Item."',1)
          s=s.replace('    - "Issue exactly one repository-local implementation authorization for the R2 Work Item."','    - "Issue exactly one repository-local implementation authorization for the R3 Work Item."',1)
          p.write_text(s,encoding='utf-8')

          # Human current-state projection.
          p=Path('spec/architect/current-state.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('**ACTIVE — R2 WORK-054 system-composition implementation authorized.**','**READY — R2 W054 accepted; R3 production protocol conformance is next.**')
          s=s.replace('Roadmap: `spec/architect/roadmap.yaml` — **FROZEN, Version 1.3, sole program-roadmap authority**','Roadmap: `spec/architect/roadmap.yaml` — **FROZEN, Version 1.4, sole program-roadmap authority**')
          s=s.replace('- R2: `ACTIVE` — WORK-054 / WORK-054-CORE-001','- R2: `COMPLETED` — WORK-054 / DEC-0085')
          if '- Governing decisions: `DEC-0081`, `DEC-0082`, `DEC-0083`, `DEC-0084`, `DEC-0085`' not in s:
              s=s.replace('- Governing decisions: `DEC-0081`, `DEC-0082`, `DEC-0083`, `DEC-0084`','- Governing decisions: `DEC-0081`, `DEC-0082`, `DEC-0083`, `DEC-0084`, `DEC-0085`',1)
          s=s.replace('- Active Work Item: WORK-054\n- Active authorization: WORK-054-CORE-001\n- Active implementation authorization count: one','- Active Work Item: none\n- Active authorization: none\n- Active implementation authorization count: zero',1)
          s=s.replace('R2 implementation is active under WORK-054-CORE-001. The implementation branch must be cut from the exact authorized baseline and may not modify spec/architect/.','R2 implementation is complete under DEC-0085. W054 established the composition/conformance seam across the accepted authorities without creating a second canonical authority.',1)
          if '## Next governed gate' not in s:
              s=s.replace('## Independent physical evidence','## Next governed gate\n\nR3 is the next product-development gate: production protocol conformance and wire-compatibility proof. It requires a fresh Work Item and exactly one implementation authorization.\n\n## Independent physical evidence',1)
          p.write_text(s,encoding='utf-8')

          # Roadmap authoritative projection.
          p=Path('spec/architect/roadmap.yaml'); s=p.read_text(encoding='utf-8')
          s=s.replace('# FROZEN — roadmap version 1.2','# FROZEN — roadmap version 1.4',1)
          s=s.replace('roadmap_version: "1.3"','roadmap_version: "1.4"',1)
          s=s.replace('supersedes_roadmap_version: "1.2"','supersedes_roadmap_version: "1.3"',1)
          s=s.replace('superseding_decision: DEC-0084','superseding_decision: DEC-0085',1)
          s=re.sub(r'(?m)^  actual_main_sha: .*$', '  actual_main_sha: '+MAIN, s,count=1)
          s=re.sub(r'(?m)^  last_reconciled_snapshot_sha: .*$', '  last_reconciled_snapshot_sha: '+MAIN, s,count=1)
          s=s.replace('program_state: R2_SYSTEM_COMPOSITION_CONFORMANCE_ACTIVE','program_state: R3_PROTOCOL_PRODUCTION_CONFORMANCE_READY',1)
          s=s.replace('execution_mode: active','execution_mode: ready',1)
          s=s.replace('  active_work_item: WORK-054','  active_work_item: null',1)
          s=s.replace('  active_authorization: WORK-054-CORE-001','  active_authorization: null',1)
          s=s.replace('halt_reason: "R2 WORK-054 is authorized and active under DEC-0084."','halt_reason: "W054 accepted under DEC-0085. R3 requires a fresh Work Item and authorization."',1)
          s=s.replace('next_gate: R2_SYSTEM_COMPOSITION_CONFORMANCE','next_gate: R3_PROTOCOL_PRODUCTION_CONFORMANCE',1)
          r2=s.find('  - id: R2_SYSTEM_COMPOSITION_CONFORMANCE\n'); r3=s.find('  - id: R3_PROTOCOL_PRODUCTION_CONFORMANCE\n',r2)
          if r2<0 or r3<0: raise SystemExit('roadmap R2/R3 markers missing')
          r2block='''  - id: R2_SYSTEM_COMPOSITION_CONFORMANCE\n    status: COMPLETED\n    active_work_item: null\n    active_authorization: null\n    objective: "Prove the complete commercial/connectivity composition without introducing a second authority."\n    chain: "intent -> offer -> eligibility -> reservation/lease -> candidate selection -> NetworkPath validation -> containment -> session -> delivered traffic -> usage -> BILLABLE_FINAL -> allocation -> external payment reference -> reconciliation"\n    completion_sha: "22c21309390518a7f4869e057cfee59cde049be0"\n    acceptance: "DEC-0085; W054 exact reviewed head f6824ccd0beb28b69c932e87610a63856f1399d6; PR #4 merged as 22c21309390518a7f4869e057cfee59cde049be0; exact-head W054 battery 33970713183 SUCCESS."\n    mandatory_negative_proofs:\n      - "payment success cannot create connectivity"\n      - "reservation success cannot imply reachability"\n      - "marketplace discovery cannot activate a path"\n      - "W050 capability declaration cannot enforce containment"\n      - "W049 client state cannot become canonical state"\n      - "API/webhook observation cannot become a second source of truth"\n      - "software evidence cannot close physical evidence"\n    authorization_rule: "R2 execution is complete. No implementation authorization remains active."\n\n'''
          s=s[:r2]+r2block+s[r3:]
          s=s.replace('  - id: R3_PROTOCOL_PRODUCTION_CONFORMANCE\n    status: AFTER_R2','  - id: R3_PROTOCOL_PRODUCTION_CONFORMANCE\n    status: READY',1)
          if '    - id: WORK-054\n' not in s:
              pos=s.find('\nroadmap:\n')
              entry='''\n    - id: WORK-054\n      status: accepted-merged\n      reviewed_sha: f6824ccd0beb28b69c932e87610a63856f1399d6\n      merge_sha: 22c21309390518a7f4869e057cfee59cde049be0\n      current_mainline: present\n      acceptance_provenance: "DEC-0085; exact reviewed head f6824ccd0beb28b69c932e87610a63856f1399d6; exact-head battery 33970713183 SUCCESS."\n'''
              s=s[:pos]+entry+s[pos:]
          p.write_text(s,encoding='utf-8')

          # Decision index.
          p=Path('spec/architect/decisions/README.md'); s=p.read_text(encoding='utf-8')
          if '`DEC-0085`' not in s:
              s=s.rstrip()+'\n\n- `DEC-0085` — accepts WORK-054 and closes R2; releases the W054 authorization and advances the next gate to R3.\n'
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/w054-acceptance-final2.yml
          git config user.name 'ADCOS Architect'
          git config user.email '150378018+payswapdotorg@users.noreply.github.com'
          git add spec/architect .github/workflows/w054-acceptance-final2.yml
          git commit -m 'governance: accept W054 and advance R2 to R3 [skip ci]'
          git push origin HEAD:governance/w054-acceptance-final2-20260905
