name: temporary-w052-w053-governance

on:
  push:
    branches:
      - governance/w052-acceptance-w053-activation

permissions:
  contents: write

jobs:
  transition:
    if: github.ref == 'refs/heads/governance/w052-acceptance-w053-activation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply atomic governance transition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          ROOT = Path('.')
          MAIN = 'bcaf0d0677437d1ffca8f5e493cab516c87e7194'
          REVIEWED = '7d883b227e9792b98efdbc1916d413491d20d458'
          CI = '33926974221'
          OLD = '39d40b752f9129ac898fb74da1e485c20c6fbdc6'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')
          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          # W052 authorization -> superseded.
          p = 'spec/architect/authorizations/WORK-052.yaml'
          s = read(p)
          s = s.replace('status: active\n', 'status: superseded\n', 1)
          s = s.replace('authorized: true\n', 'authorized: false\n', 1)
          if 'superseded_by:' not in s:
              s = s.replace('authorization_decision: DEC-0059\n', 'authorization_decision: DEC-0059\nsuperseded_by: WORK-053-CORE-001\nsupersession_decision: DEC-0061\n', 1)
          write(p, s)

          # Fresh W053 authorization from historical W053 work order, with current decision/baseline.
          old_auth = subprocess.check_output([
              'git','show','c9a1f8589cddbbeb21756bdd8f72ed57ea515173:spec/architect/authorizations/WORK-053.yaml'
          ], text=True)
          auth = old_auth.replace('Issued by DEC-0060 after W052 acceptance.', 'Issued by DEC-0061 after Architect acceptance of W052 PR #149.')
          auth = auth.replace('authorization_decision: DEC-0060', 'authorization_decision: DEC-0061')
          auth = re.sub(r'^baseline_sha: .*$', 'baseline_sha: ' + MAIN, auth, flags=re.M)
          auth = re.sub(r'^review_basis: .*$', 'review_basis: "DEC-0061 accepts W052 on PR #149 exact reviewed head ' + REVIEWED + ', merged as ' + MAIN + '; W053 issue #85 is the next hard-dependent commercial Work Item. This fresh authorization is issued against the post-W052-merge mainline."', auth, flags=re.M)
          auth = auth.replace('WORK-052 UsageLedger (accepted-merged by DEC-0060)', 'WORK-052 UsageLedger (accepted-merged by DEC-0061)')
          write('spec/architect/authorizations/WORK-053.yaml', auth)

          # Fresh W053 handoff: retain normative work order, remove superseded delivery addendum.
          old_handoff = subprocess.check_output([
              'git','show','c9a1f8589cddbbeb21756bdd8f72ed57ea515173:docs/WORK-053-handoff.md'
          ], text=True)
          handoff = old_handoff.split('\n---\n',1)[0]
          handoff = handoff.replace(
              'Status: Architect work order issued; implementation remains gated on the repository-local W052 acceptance -> W053 activation transition.',
              'Status: ACTIVE IMPLEMENTATION AUTHORIZATION — W052 is accepted/merged and WORK-053-CORE-001 is active on the current mainline.'
          )
          handoff = handoff.replace(
              'The Architect must first persist W052 acceptance, supersede `WORK-052-CORE-001`, and activate exactly one `WORK-053-CORE-001` repository-local authorization on `main`. Until that transition is merged, Z.ai must not create a W053 implementation branch or implementation PR.',
              'The Architect has persisted W052 acceptance and this governance transition activates exactly one `WORK-053-CORE-001` repository-local authorization on `main`. Z.ai may now create the single W053 implementation branch from the exact live mainline carrying that authorization.'
          )
          handoff += '\n\n## Current activation packet\n\n**Activation decision:** `DEC-0061` (atomic W052 acceptance → W053 activation).\n**Authorized main baseline:** `' + MAIN + '`.\n**Work Item:** `WORK-053`.\n**Authorization:** `WORK-053-CORE-001`.\n**Dependencies:** `WORK-052` (accepted/merged at this transition); W051 is satisfied transitively through the frozen commercial DAG.\n**Implementation branch:** `work-053-economic-allocation`.\n**Implementation PR:** one PR only.\n**Authorization file must remain byte-identical in the implementation PR; `spec/architect/` is out of scope for implementation.\n**Historical note:** former PR #124 / merge `c9a1f858` belonged to a superseded governance lineage and must not be reused as current implementation state.\n'
          write('docs/WORK-053-handoff.md', handoff)

          # Execution ledger W052/W053 blocks.
          p = 'spec/architect/execution-ledger.yaml'
          ledger = read(p)
          ledger = ledger.replace('main_sha: ' + OLD, 'main_sha: ' + MAIN, 1)
          w052 = '''  - work_item: WORK-052
            title: "UsageLedger: delivered-usage metering, billable finality, and append-only reconciliation"
            phase: 10
            branch: "work-052-usage-ledger-2"
            baseline_sha: 39d40b752f9129ac898fb74da1e485c20c6fbdc6
            pr: 149
            pr_head: 7d883b227e9792b98efdbc1916d413491d20d458
            reviewed_sha: 7d883b227e9792b98efdbc1916d413491d20d458
            merge_sha: bcaf0d0677437d1ffca8f5e493cab516c87e7194
            merged_at: 2026-09-04T23:01:09Z
            ci_run: 33926974221
            review_rounds: 3
            acceptance_decision: DEC-0061
            correction_decisions: []
            handoff: docs/WORK-052-handoff.md
            handoff_required: true
            lifecycle: accepted-merged
            note: "Architect-accepted after three review rounds on one PR lineage: 23cca95 -> a783078 -> 7d883b2. Exact reviewed acceptance head 7d883b227e9792b98efdbc1916d413491d20d458; merged mainline bcaf0d0677437d1ffca8f5e493cab516c87e7194; CI 33926974221 SUCCESS. WORK-052-CORE-001 is superseded by DEC-0061; scope, provenance, and correction history remain preserved. Software evidence only; W040 physical obligations remain independent and OPEN."
'''
          w053 = '''  - work_item: WORK-053
            title: "EconomicAllocation: developer/provider/ADCOS revenue-share policy and external payment boundary"
            phase: 10
            branch: null
            baseline_sha: null
            pr: null
            pr_head: null
            reviewed_sha: null
            merge_sha: null
            merged_at: null
            ci_run: null
            review_rounds: null
            acceptance_decision: null
            correction_decisions: []
            handoff: docs/WORK-053-handoff.md
            handoff_required: true
            lifecycle: registered
            note: "Registered-only W053 now has the sole active repository-local authorization WORK-053-CORE-001 under DEC-0061 at the exact post-W052-merge mainline bcaf0d0677437d1ffca8f5e493cab516c87e7194. No implementation has yet been delivered or accepted. Historical W053 PR #124 / merge c9a1f858 is superseded lineage and is not current implementation state."
'''
          start = ledger.index('  - work_item: WORK-052\n')
          end = ledger.index('  - work_item: WORK-053\n', start)
          ledger = ledger[:start] + w052 + ledger[end:]
          start = ledger.index('  - work_item: WORK-053\n')
          end = ledger.index('\nreconciliations:\n', start)
          ledger = ledger[:start] + w053 + ledger[end:]
          marker = '\nreconciliations:\n'
          before, after = ledger.split(marker,1)
          recon = '''\n  - reconciliation_id: LEDGER-RECON-010\n    recorded_by: DEC-0061\n    recorded_at: 2026-09-04T23:01:09Z\n    from_main_sha: 39d40b752f9129ac898fb74da1e485c20c6fbdc6\n    to_main_sha: bcaf0d0677437d1ffca8f5e493cab516c87e7194\n    reason: "Atomic W052 acceptance -> W053 activation transition: W052 exact reviewed head 7d883b2 is accepted by DEC-0061 and merged as bcaf0d0 with CI 33926974221 SUCCESS; W052 transitions registered -> accepted-merged; WORK-052-CORE-001 is superseded; the single active execution slot transfers to WORK-053-CORE-001 at the exact post-W052-merge mainline; W053 remains registered-only in the execution ledger until its own implementation is delivered and accepted. Historical W053 PR #124 lineage is not reused."\n    history: "No prior Work Item history is silently rewritten. WORK-001..WORK-051 records and prior reconciliation entries remain unchanged; W052 receives its actual delivery/review facts and acceptance decision DEC-0061; W053 remains a registered Work Item with no delivery facts while its fresh repository-local authorization is activated; W040 remains in-review with independent physical obligations. The snapshot baseline advances from the reconciled 39d40b7 state to the post-W052 merge bcaf0d0; synchronized execution-state/current-state/roadmap projections are updated in the same governance transition. Frozen architecture semantics are unchanged."\n'''
          ledger = before + marker + recon + after
          write(p, ledger)

          # Execution state: sole active slot -> W053.
          p = 'spec/architect/execution-state.yaml'
          es = read(p).replace('  main_sha: ' + OLD, '  main_sha: ' + MAIN, 1)
          a = es.index('execution:\n')
          b = es.index('\nin_review:\n', a)
          execution = f'''execution:\n  mode: "implementing"\n  active_work_item: WORK-053\n  active_authorization: "WORK-053-CORE-001"\n  halted_reason: "Atomic transition (DEC-0061): WORK-052 is Architect-accepted and merged (PR #149 exact reviewed head {REVIEWED}, merge {MAIN}, CI run {CI} SUCCESS; three review rounds including two correction rounds; SOFTWARE-class evidence only). WORK-052-CORE-001 is superseded; W052 is accepted-merged. The sole active execution slot transfers to WORK-053-CORE-001 at the exact post-W052-merge mainline {MAIN}. W053 consumes W052 billable-final facts and is authorized only for its frozen EconomicAllocation scope; no W053 implementation has yet been delivered. W040 remains an independent physical validation track (in-review, not accepted; EVID-007/EVID-008 remain OPEN and W040-owned). WORK-043 is retired; WORK-044..WORK-052 except accepted W052 remain unauthorized. Historical W053 PR #124 is superseded lineage and is not current implementation state."\n  next_required_decisions:\n    - "Review the WORK-053 implementation PR on the exact active authorization baseline; require the frozen EconomicAllocation contract, authority boundaries, deterministic battery, replay integrity, and exact conservation proofs before acceptance."\n    - "After WORK-053 acceptance/merge, evaluate the next authorized Work Item in the frozen commercial DAG; W044 and W045 remain hard-gated by W053 and preceding commercial dependencies."\n    - "Resume W040 physical validation only under a future evidence-continuation authorization once physical evidence is available; EVID-007/EVID-008 remain OPEN."\n    - "Disposition superseded governance threads PR #100, PR #102, PR #108, and the historical W053 PR #124 according to their existing durable records; do not revive superseded implementation lineages."\n'''
          es = es[:a] + execution + es[b:]
          write(p, es)

          # Current-state projection.
          p = 'spec/architect/current-state.md'
          cs = read(p)
          cs = cs.replace('**Persistent Architect snapshot — reconciled after the atomic WORK-051 acceptance → W052 activation (DEC-0059, LEDGER-RECON-008) and the WORK-052 baseline-advancement-only reconciliation (DEC-0060, LEDGER-RECON-009); WORK-052 (UsageLedger) is the active implementation track under WORK-052-CORE-001.**', '**Persistent Architect snapshot — reconciled by DEC-0061 / LEDGER-RECON-010 after Architect acceptance and merge of W052; WORK-053 (EconomicAllocation) is the sole active implementation track under WORK-053-CORE-001.**')
          cs = cs.replace('- Active Work Item: `WORK-052`', '- Active Work Item: `WORK-053`')
          cs = re.sub(r'- Active authorization: `WORK-052-CORE-001`.*', '- Active authorization: `WORK-053-CORE-001` (DEC-0061), baseline `' + MAIN + '` (atomic W052 acceptance → W053 activation)', cs, count=1)
          cs = re.sub(r'- W052 status: .*?- no W052 implementation branch or PR exists; implementation is gated on the Architect post-reconciliation live-state re-read and fresh activation packet', '- W052 status: `accepted-merged` — UsageLedger accepted by DEC-0061 on exact reviewed head `7d883b2`, merged as `' + MAIN + '` with CI run `' + CI + '` SUCCESS; WORK-052-CORE-001 is superseded and its delivery/evidence history is preserved', cs, count=1, flags=re.S)
          if '- W053 status:' not in cs:
              anchor = '- W052 Architect work order: `docs/WORK-052-handoff.md`'
              cs = cs.replace(anchor, anchor + '\n- W053 status: `active-authorized` — EconomicAllocation is the sole active Work Item under `WORK-053-CORE-001` / DEC-0061 at baseline `' + MAIN + '`; implementation has not yet been delivered\n- W053 Architect handoff: `docs/WORK-053-handoff.md`')
          cs = cs.replace('`WORK-052` is the **active authorized** chain successor', '`WORK-052` is **accepted-merged**')
          cs = cs.replace('`WORK-053` EconomicAllocation (issue #85) remains a ready-candidate, unauthorized (hard-gated on W052).', '`WORK-053` EconomicAllocation (issue #85) is the **active authorized** chain successor under `WORK-053-CORE-001` (DEC-0061, baseline `' + MAIN + '`) and is the sole current implementation target.')
          cs = cs.replace('The active authorization is scoped to WORK-052 only and does not authorize WORK-043 (retired), WORK-044–WORK-050, WORK-053', 'The active authorization is scoped to WORK-053 only and does not authorize WORK-043 (retired), WORK-044–WORK-052')
          write(p, cs)

          # Canonical roadmap YAML.
          p = 'spec/architect/roadmap.yaml'
          rm = read(p)
          rm = re.sub(r'^last_reconciled_main_sha: .*$', 'last_reconciled_main_sha: ' + MAIN, rm, flags=re.M)
          rm = re.sub(r'^  WORK-052: .*$', '  WORK-052: {title: UsageLedger: delivered-usage metering, billable finality, and append-only reconciliation, status: accepted-merged, authorization: none, dependencies: [WORK-051], dependency_type: [hard], contract: issue-84+docs/WORK-052-handoff.md, decision: DEC-0061}', rm, flags=re.M)
          rm = re.sub(r'^  WORK-053: .*$', '  WORK-053: {title: EconomicAllocation: developer/provider/ADCOS revenue-share policy and external payment boundary, status: active-authorized, authorization: WORK-053-CORE-001, dependencies: [WORK-052], dependency_type: [hard], contract: issue-85+docs/WORK-053-handoff.md, architecture_basis: ACR-009}', rm, flags=re.M)
          rm = re.sub(r'^  active: WORK-052$', '  active: WORK-053', rm, flags=re.M)
          rm = re.sub(r'^  next_after_active: \[WORK-053\]$', '  next_after_active: []', rm, flags=re.M)
          write(p, rm)

          # Human-readable roadmap projection.
          p = 'spec/architect/roadmap.md'
          rmd = read(p)
          rmd = rmd.replace('Live main at governance-branch cut: `2e87cb35643b72a94be39aa3eb96ceed1a3e18da`', 'Live main at W052 acceptance/transition: `' + MAIN + '`')
          rmd = rmd.replace('Active Work Item: **WORK-052 UsageLedger**', 'Active Work Item: **WORK-053 EconomicAllocation**')
          rmd = rmd.replace('Active authorization: **WORK-052-CORE-001**', 'Active authorization: **WORK-053-CORE-001**')
          rmd = rmd.replace('Authorized baseline: **39d40b752f9129ac898fb74da1e485c20c6fbdc6**', 'Authorized baseline: **' + MAIN + '**')
          rmd = rmd.replace('W052: active-authorized, implementation not yet delivered', 'W052: accepted/merged at exact reviewed head `7d883b2`, merge `' + MAIN + '`')
          rmd = rmd.replace('W053: accepted/merged', 'W053: active-authorized; implementation not yet delivered')
          rmd = rmd.replace('The live baseline was reconciled by DEC-0060 / LEDGER-RECON-009 and PR #147, merged as `2e87cb3`. The authorization itself is unchanged; only the persistent baseline was advanced to the authorization-bearing post-transition mainline.', 'W052 acceptance and W053 activation are reconciled by DEC-0061 / LEDGER-RECON-010 on post-W052 mainline `' + MAIN + '`. W052 is accepted/merged; W053 is the sole active authorization.')
          rmd = rmd.replace('Accepted / merged | W001–W039, W041, W042, W044–W051, W053', 'Accepted / merged | W001–W039, W041, W042, W044–W052')
          rmd = rmd.replace('Active / authorized | W052', 'Active / authorized | W053')
          rmd = rmd.replace('## W052 execution packet', '## W053 execution packet')
          rmd = rmd.replace('Contract: `spec/work-items.md` WORK-052 + `docs/WORK-052-handoff.md` + `spec/architect/authorizations/WORK-052.yaml`.', 'Contract: `spec/work-items.md` WORK-053 + `docs/WORK-053-handoff.md` + `spec/architect/authorizations/WORK-053.yaml`.')
          rmd = rmd.replace('Exactly one Work Item may be active-authorized. The current target is W052. After W052 is accepted/merged, W053 is the next hard-gated commercial item only after a fresh governance transition issues its own authorization. Roadmap placement alone never activates W053 or any other downstream item.', 'Exactly one Work Item may be active-authorized. The current target is W053 under `WORK-053-CORE-001`. Roadmap placement alone never authorizes W044 or any other downstream item.')
          write(p, rmd)

          # Decision registry + new durable decision.
          p = 'spec/architect/decisions/README.md'
          dr = read(p)
          row = '| DEC-0061 | governance | WORK-052 | ACCEPTED | ACCEPTED | W052 acceptance on PR #149 exact reviewed head 7d883b2 / merge bcaf0d0 and atomic activation of fresh WORK-053-CORE-001 on the post-W052 mainline; W052 authorization superseded, W053 implementation remains unaccepted |'
          if '| DEC-0061 |' not in dr:
              anchor = '| DEC-0060 | governance | WORK-052 | ACCEPTED | ACCEPTED | W052 baseline reconciliation:'
              idx = dr.index(anchor)
              line_end = dr.index('\n', idx)
              dr = dr[:line_end+1] + row + '\n' + dr[line_end+1:]
          write(p,dr)
          decision = f'''decision_id: DEC-0061\ntype: governance\ndecision: ACCEPTED\nstatus: ACCEPTED\nwork_item: WORK-052\npr: 149\nreviewed_sha: {REVIEWED}\ntimestamp: 2026-09-04T23:01:09Z\nevidence:\n  merge_sha: {MAIN}\n  artifacts:\n    - "PR #149 exact-head Architect acceptance of W052"\n    - "W052 correction lineage: 23cca95 -> a783078 -> {REVIEWED}"\n    - "CI run {CI}: SUCCESS"\n    - "Issue #84 completed"\nfindings:\n  - "W052 replay-integrity P0 corrected at round 2 by symmetric W051 delivery-eligibility replay validation and case_49."\n  - "W052 is complete within WORK-052-CORE-001 scope and its frozen contract."\nblockers: []\nrequired_corrections: []\naccepted_scope:\n  - "WORK-052-CORE-001 UsageLedger implementation as reviewed on exact head {REVIEWED}."\n  - "Two correction rounds on the same PR lineage."\nrejected_scope:\n  - "No WORK-053 implementation is accepted by this decision; W053 activation is a separate downstream authorization effect of this atomic governance transition."\ndownstream_effect:\n  - "WORK-052 lifecycle transitions registered -> accepted-merged."\n  - "WORK-052-CORE-001 becomes superseded and authorized false."\n  - "WORK-053-CORE-001 becomes the sole active repository-local implementation authorization at main baseline {MAIN}."\n  - "Historical W053 PR #124 remains superseded lineage and is not reused."\nresolved_by: null\n'''
          write('spec/architect/decisions/DEC-0061-w052-acceptance-w053-activation.yaml', decision)
          print('atomic governance transition prepared')
          PY
      - name: Commit transition
        run: |
          git config user.name "ADCOS Architect Governance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/architect/authorizations/WORK-052.yaml spec/architect/authorizations/WORK-053.yaml spec/architect/execution-ledger.yaml spec/architect/execution-state.yaml spec/architect/current-state.md spec/architect/roadmap.yaml spec/architect/roadmap.md spec/architect/decisions/README.md spec/architect/decisions/DEC-0061-w052-acceptance-w053-activation.yaml docs/WORK-053-handoff.md
          git diff --cached --check
          git commit -m "governance: accept W052 and activate W053 (DEC-0061)"
          git push origin HEAD:governance/w052-acceptance-w053-activation
