name: temporary-governance-cleanup

on:
  push:
    branches:
      - governance/w052-acceptance-w053-activation

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize governance transition and remove temporary machinery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          ROOT=Path('.')
          MAIN='bcaf0d0677437d1ffca8f5e493cab516c87e7194'
          REVIEWED='7d883b227e9792b98efdbc1916d413491d20d458'
          CI='33926974221'
          OLD='39d40b752f9129ac898fb74da1e485c20c6fbdc6'

          # Remove the duplicate transition header if a prior runner invocation added it twice.
          p=ROOT/'spec/architect/execution-ledger.yaml'
          text=p.read_text()
          hdr='# DEC-0061 / LEDGER-RECON-010: W052 acceptance -> W053 activation on post-W052 merge bcaf0d0.\n'
          while text.startswith(hdr+hdr):
              text=text[len(hdr):]

          # Canonicalize LEDGER-RECON-010 to exactly one block and preserve every prior reconciliation unchanged.
          marker='\nreconciliations:\n'
          if marker not in text:
              raise SystemExit('missing reconciliations section')
          prefix, body=text.split(marker,1)
          lines=body.splitlines(True)
          blocks=[]; cur=[]
          for line in lines:
              if line.startswith('  - reconciliation_id: '):
                  if cur: blocks.append(cur)
                  cur=[line]
              else:
                  cur.append(line)
          if cur: blocks.append(cur)
          blocks=[b for b in blocks if not any('reconciliation_id: LEDGER-RECON-010' in x for x in b)]
          recon='''  - reconciliation_id: LEDGER-RECON-010\n    recorded_by: DEC-0061\n    recorded_at: 2026-09-04T23:01:09Z\n    from_main_sha: 39d40b752f9129ac898fb74da1e485c20c6fbdc6\n    to_main_sha: bcaf0d0677437d1ffca8f5e493cab516c87e7194\n    reason: "Atomic W052 acceptance -> W053 activation: W052 exact reviewed head 7d883b2 accepted and merged as bcaf0d0 with CI 33926974221 SUCCESS; W052 transitions to accepted-merged, its authorization is superseded, and the sole active execution slot transfers to fresh WORK-053-CORE-001. W053 remains registered-only until its own implementation is delivered and accepted."\n    history: "No prior Work Item history is silently rewritten; prior reconciliation entries remain intact. W040 remains independent and in-review; frozen architecture semantics are unchanged. Historical W053 PR #124 is not reused."\n'''.splitlines(True)
          body=''.join(recon)+''.join(''.join(b) for b in blocks)
          p.write_text(text.split(marker,1)[0]+marker+body)

          # Sanity: W052/W053 active-state facts are present before cleanup.
          ledger=p.read_text()
          assert ledger.count('reconciliation_id: LEDGER-RECON-010')==1
          assert ledger.count('  - work_item: WORK-052\n')==1
          assert ledger.count('  - work_item: WORK-053\n')==1

          # Remove temporary files; no temporary workflow survives the governance PR.
          for path in ['.github/workflows/_tmp_w052_w053_governance.yml','governance/.w052-w053-transition-trigger']:
              q=ROOT/path
              if q.exists(): q.unlink()
          print('governance state canonicalized; temporary automation removed')
          PY
          git config user.name "ADCOS Architect Governance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "governance: finalize W052 acceptance and W053 activation"
          git push origin HEAD:governance/w052-acceptance-w053-activation
