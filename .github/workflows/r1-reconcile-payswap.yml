name: R1 reconcile payswap
on:
  push:
    branches:
      - governance/r1-reconcile-payswap-20260905
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile R1 ledger
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/pectoraux/ADCOS.git refs/heads/governance/w050-baseline-reconciliation:refs/remotes/legacy/w050-baseline-reconciliation
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          live = Path('spec/architect/execution-ledger.yaml')
          current = live.read_text()
          source = subprocess.check_output(['git', 'show', 'refs/remotes/legacy/w050-baseline-reconciliation:spec/architect/execution-ledger.yaml'], text=True)
          cur_start = current.index('  - work_item: WORK-044\n')
          cur_end = current.index('reconciliations:\n', cur_start)
          src_start = source.index('  - work_item: WORK-044\n')
          src_end = source.index('  - work_item: WORK-051\n', src_start)
          accepted_044_049 = source[src_start:src_end]
          w050_start = current.index('  - work_item: WORK-050\n', cur_start)
          w051_start = current.index('  - work_item: WORK-051\n', w050_start)
          w050 = current[w050_start:w051_start]
          w050 = w050.replace('    lifecycle: registered\n', '    lifecycle: accepted-merged\n', 1)
          w050 = w050.replace('    acceptance_decision: null\n', '    acceptance_decision: DEC-0083\n', 1)
          w050 = w050.replace('    note: "registered-only entry added by ACR-011:', '    note: "accepted by DEC-0083 from the exact final W050.4 delivery head 815f4febbc64d55d3576386e65adaa6244c4f7cb with permanent 76/76 deterministic verification and SOFTWARE/PHYSICAL boundary evidence. Original registration/activation provenance follows:', 1)
          current_051_053 = current[w051_start:cur_end]
          current = current[:cur_start] + accepted_044_049 + w050 + current_051_053 + current[cur_end:]
          current = re.sub(r'(?m)^main_sha: .*$', 'main_sha: 338af793923e1267ff3523de4310be273d75a2cd', current, count=1)
          recon = '''\n  - reconciliation_id: LEDGER-RECON-024\n    recorded_by: DEC-0083\n    recorded_at: 2026-09-05T09:07:22Z\n    from_main_sha: 7fb47bb312708d06f3b3c1ba0496104362c7d135\n    to_main_sha: 338af793923e1267ff3523de4310be273d75a2cd\n    reason: "R1 lifecycle normalization: reconcile W044-W049 to their exact durable accepted delivery facts, record W050 retrospective acceptance under DEC-0083, and advance the ledger snapshot to the canonical fork baseline."\n    history: "No prior reconciliation or Git history is rewritten. W044-W049 retain their accepted reviewed SHA, PR, merge, and acceptance provenance from repository history. W050 gains a discrete DEC-0083 acceptance record while retaining its prior registration/activation provenance. W051-W053 remain byte-identical to the current fork state. W040 remains in-review and independently W040-owned for physical evidence. No implementation, architecture, protocol, or physical-evidence state changes."\n'''
          if 'LEDGER-RECON-024' in current:
              raise SystemExit('LEDGER-RECON-024 already present')
          live.write_text(current.rstrip() + recon)
          PY
          git config user.name 'ADCOS Architect'
          git config user.email '150378018+payswapdotorg@users.noreply.github.com'
          git add spec/architect/execution-ledger.yaml
          git rm -f .github/workflows/r1-reconcile-payswap.yml
          git commit -m 'governance: reconcile R1 lifecycle ledger [skip ci]'
          git push origin HEAD:governance/r1-reconcile-payswap-20260905
