name: R1 baseline advance
on:
  push:
    branches:
      - governance/r1-final-baseline-20260905
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance reconciled snapshot to merged main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          new_main = '11bd981612274c69912fad7ea2e0de781514b347'
          # Ledger snapshot.
          p = Path('spec/architect/execution-ledger.yaml'); s = p.read_text()
          s = re.sub(r'(?m)^main_sha: .*$', 'main_sha: '+new_main, s, count=1)
          if 'LEDGER-RECON-025' not in s:
              s = s.rstrip() + '''\n  - reconciliation_id: LEDGER-RECON-025\n    recorded_by: DEC-0083\n    recorded_at: 2026-09-05T13:00:00Z\n    from_main_sha: 338af793923e1267ff3523de4310be273d75a2cd\n    to_main_sha: 11bd981612274c69912fad7ea2e0de781514b347\n    reason: "Post-R1 merge baseline advancement only: advance the lifecycle ledger snapshot from the pre-merge R1 checkpoint to the actual merged mainline commit. No Work Item lifecycle, acceptance, architecture, protocol, or physical-evidence state changes."\n    history: "DEC-0083 remains the governing R1 reconciliation decision. No prior reconciliation or Git history is rewritten."\n'''
          p.write_text(s)
          # Execution state.
          p = Path('spec/architect/execution-state.yaml'); s = p.read_text()
          s = s.replace('main_sha: 338af793923e1267ff3523de4310be273d75a2cd','main_sha: '+new_main,1)
          s = s.replace('lifecycle_ledger_snapshot_sha: 338af793923e1267ff3523de4310be273d75a2cd','lifecycle_ledger_snapshot_sha: '+new_main,1)
          s = s.replace('reconciled_checkpoint_sha: 338af793923e1267ff3523de4310be273d75a2cd','reconciled_checkpoint_sha: '+new_main,1)
          p.write_text(s)
          # Roadmap.
          p = Path('spec/architect/roadmap.yaml'); s = p.read_text()
          s = s.replace('actual_main_sha: 338af793923e1267ff3523de4310be273d75a2cd','actual_main_sha: '+new_main,1)
          s = s.replace('last_reconciled_snapshot_sha: 338af793923e1267ff3523de4310be273d75a2cd','last_reconciled_snapshot_sha: '+new_main,1)
          p.write_text(s)
          # Human state.
          p = Path('spec/architect/current-state.md'); s = p.read_text()
          s = s.replace('Canonical reconciled checkpoint: `338af793923e1267ff3523de4310be273d75a2cd`','Canonical reconciled checkpoint: `'+new_main+'`',1)
          p.write_text(s)
          # No temporary workflow survives the governance transition.
          Path('.github/workflows/r1-baseline-advance.yml').unlink()
          PY
          git config user.name 'ADCOS Architect'
          git config user.email '150378018+payswapdotorg@users.noreply.github.com'
          git add spec/architect .github/workflows/r1-baseline-advance.yml
          git commit -m 'governance: advance R1 reconciled snapshot to merged main [skip ci]'
          git push origin HEAD:governance/r1-final-baseline-20260905
