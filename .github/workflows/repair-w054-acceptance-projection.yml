name: repair W054 acceptance projection
on:
  push:
    branches:
      - governance/repair-w054-acceptance-projection-20260905
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and normalize execution projections
        shell: bash
        run: |
          set -euo pipefail
          git checkout 22c21309390518a7f4869e057cfee59cde049be0 -- spec/architect/execution-state.yaml
          python3 - <<'PY'
          from pathlib import Path
          import re
          MAIN='47348f42eea49b2614fc18e5d34ce243b11bafc3'
          p=Path('spec/architect/execution-state.yaml')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(?m)^  main_sha: .*$', '  main_sha: '+MAIN, s, count=1)
          s=re.sub(r'(?m)^  lifecycle_ledger_snapshot_sha: .*$', '  lifecycle_ledger_snapshot_sha: '+MAIN, s, count=1)
          s=re.sub(r'(?m)^  roadmap_version_reference: .*$', '  roadmap_version_reference: "1.4"', s, count=1)
          s=re.sub(r'(?m)^  mode: active$', '  mode: ready', s, count=1)
          s=re.sub(r'(?m)^  active_work_item: WORK-054$', '  active_work_item: null', s, count=1)
          s=re.sub(r'(?m)^  active_authorization: WORK-054-CORE-001$', '  active_authorization: null', s, count=1)
          s=re.sub(r'(?m)^  halted_reason: null$', '  halted_reason: "W054 accepted under DEC-0085. No implementation authorization is active. R3 production protocol conformance requires a fresh Work Item and authorization."', s, count=1)
          old='    - "Create the governed R2 Work Item for system-composition conformance without introducing a second authority."'
          new='    - "Create the governed R3 production-protocol-conformance Work Item."'
          s=s.replace(old,new,1)
          old='    - "Issue exactly one repository-local implementation authorization for the R2 Work Item."'
          new='    - "Issue exactly one repository-local implementation authorization for the R3 Work Item."'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('spec/architect/current-state.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- Canonical reconciled checkpoint: `ba3717fad3cc4a5894ff3fe4768e47e7db584c`','- Canonical reconciled checkpoint: `'+MAIN+'`',1)
          s=s.replace('- Governing decisions: `DEC-0081`, `DEC-0082`, `DEC-0083`','- Governing decisions: `DEC-0081`, `DEC-0082`, `DEC-0083`, `DEC-0084`, `DEC-0085`',1)
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/repair-w054-acceptance-projection.yml').unlink()
          PY
          git config user.name 'ADCOS Architect'
          git config user.email '150378018+payswapdotorg@users.noreply.github.com'
          git add spec/architect .github/workflows/repair-w054-acceptance-projection.yml
          git commit -m 'governance: repair W054 acceptance projections [skip ci]'
          git push origin HEAD:governance/repair-w054-acceptance-projection-20260905
