name: Fix W050 ledger evidence
on:
  push:
    branches:
      - governance/r1-reconcile-payswap-20260905
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete retrospective W050 ledger evidence fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('spec/architect/execution-ledger.yaml')
          s = p.read_text()
          matches = list(re.finditer(r'(?ms)^  - work_item: WORK-050\n.*?(?=^  - work_item: WORK-051\n)', s))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one W050 block, found {len(matches)}')
          block = matches[0].group(0)
          block = block.replace('    reviewed_sha: null\n', '    reviewed_sha: 815f4febbc64d55d3576386e65adaa6244c4f7cb\n', 1)
          block = block.replace('    merge_sha: null\n', '    merge_sha: 815f4febbc64d55d3576386e65adaa6244c4f7cb\n', 1)
          block = block.replace('    merged_at: null\n', '    merged_at: 2026-09-04T04:08:41Z\n', 1)
          block = block.replace('    note: "accepted by DEC-0083 from the exact final W050.4 delivery head 815f4febbc64d55d3576386e65adaa6244c4f7cb with permanent 76/76 deterministic verification and SOFTWARE/PHYSICAL boundary evidence.', '    note: "accepted by DEC-0083 from the exact final W050.4 delivery/merge commit 815f4febbc64d55d3576386e65adaa6244c4f7cb (2026-09-04T04:08:41Z) with permanent 76/76 deterministic verification and SOFTWARE/PHYSICAL boundary evidence.', 1)
          s = s[:matches[0].start()] + block + s[matches[0].end():]
          p.write_text(s)
          PY
          git config user.name 'ADCOS Architect'
          git config user.email '150378018+payswapdotorg@users.noreply.github.com'
          git add spec/architect/execution-ledger.yaml
          git rm -f .github/workflows/fix-w050-ledger-evidence.yml
          git commit -m 'governance: complete W050 acceptance ledger provenance [skip ci]'
          git push origin HEAD:governance/r1-reconcile-payswap-20260905
